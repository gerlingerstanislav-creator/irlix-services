services:
  postgres:
    environment:
      RECRUITMENT_DB_USER: ${RECRUITMENT_DB_USER:-recruitment_app}
      RECRUITMENT_DB_PASSWORD: ${RECRUITMENT_DB_PASSWORD:-recruitment_local}

  employees:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}

  vacations:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}

  clients:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}

  timesheets:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}

  specialists:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}

  recruitment:
    build: { context: ./services/recruitment }
    restart: unless-stopped
    environment:
      APP_NAME: IRLIX Recruitment
      APP_KEY: base64:9Hj76n6mO7S7r+L2E7jC0tI6Oq8mYWV7u4qKk2JcA+M=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-irlix_services}
      DB_USERNAME: ${RECRUITMENT_DB_USER:-recruitment_app}
      DB_PASSWORD: ${RECRUITMENT_DB_PASSWORD:-recruitment_local}
      DB_SEARCH_PATH: recruitment
      SESSION_DRIVER: array
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: sync
      KEYCLOAK_URL: http://keycloak:8080/keycloak/auth
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost/keycloak/auth/realms/irlix}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-irlix}
      KEYCLOAK_CLIENT_ID: irlix-services-web
      EMPLOYEES_URL: http://employees:8000/api
      SPECIALISTS_URL: http://specialists:8000/api
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_started }
      employees: { condition: service_started }
      specialists: { condition: service_started }
    ports: ["127.0.0.1:8094:8000"]

  recruitment-web:
    build:
      context: .
      dockerfile: apps/recruitment/Dockerfile
    restart: unless-stopped
    depends_on: [recruitment]
    ports: ["127.0.0.1:8095:80"]

  cv-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - -hf
      - tensorblock/Cotype-Nano-GGUF:Q4_K_M
      - --alias
      - cotype-nano-q4
      - -c
      - "4096"
      - -t
      - "4"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-webui
    volumes:
      - cv_llm_cache:/root/.cache
    mem_limit: 1536m
    cpus: 3.0
    ports: ["127.0.0.1:8098:8080"]

  cv-api:
    build: { context: ./services/cv }
    restart: unless-stopped
    environment:
      CV_LLM_PROVIDER: ${CV_LLM_PROVIDER:-local}
      CV_LLM_BASE_URL: ${CV_LLM_BASE_URL:-http://cv-llm:8080/v1}
      CV_LLM_MODEL: ${CV_LLM_MODEL:-cotype-nano-q4}
      CV_LLM_CHUNK_CHARS: ${CV_LLM_CHUNK_CHARS:-6500}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_CORP}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      YANDEXGPT_BASE_URL: ${YANDEXGPT_BASE_URL:-}
      YANDEXGPT_API_KEY: ${YANDEXGPT_API_KEY:-}
      YANDEXGPT_MODEL: ${YANDEXGPT_MODEL:-yandexgpt}
      CV_EXTERNAL_LLM_BASE_URL: ${CV_EXTERNAL_LLM_BASE_URL:-}
      CV_EXTERNAL_LLM_API_KEY: ${CV_EXTERNAL_LLM_API_KEY:-}
      CV_EXTERNAL_LLM_MODEL: ${CV_EXTERNAL_LLM_MODEL:-}
    depends_on:
      cv-llm: { condition: service_started }
    mem_limit: 768m
    cpus: 1.0
    ports: ["127.0.0.1:8097:8000"]

  portal:
    depends_on:
      - recruitment
      - recruitment-web

volumes:
  cv_llm_cache:
