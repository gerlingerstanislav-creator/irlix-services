services:
  postgres:
    environment:
      RECRUITMENT_DB_USER: ${RECRUITMENT_DB_USER:-recruitment_app}
      RECRUITMENT_DB_PASSWORD: ${RECRUITMENT_DB_PASSWORD:-recruitment_local}

  keycloak:
    environment:
      KC_HOSTNAME: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}/keycloak/auth
      IRLIX_PUBLIC_URL: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}

  employees:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}
      KEYCLOAK_ISSUER: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}/keycloak/auth/realms/irlix
      IRLIX_PUBLIC_URL: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}

  vacations:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}
      KEYCLOAK_ISSUER: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}/keycloak/auth/realms/irlix

  clients:
    environment:
      IRLIX_TIMESHEETS_INTEGRATION_TOKEN: ${IRLIX_TIMESHEETS_INTEGRATION_TOKEN:-irlix-local-timesheets-token}
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}
      KEYCLOAK_ISSUER: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}/keycloak/auth/realms/irlix

  timesheets:
    environment:
      IRLIX_TIMESHEETS_INTEGRATION_TOKEN: ${IRLIX_TIMESHEETS_INTEGRATION_TOKEN:-irlix-local-timesheets-token}
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}
      KEYCLOAK_ISSUER: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}/keycloak/auth/realms/irlix

  specialists:
    environment:
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}
      KEYCLOAK_ISSUER: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}/keycloak/auth/realms/irlix

  recruitment:
    build: { context: ./services/recruitment }
    restart: unless-stopped
    environment:
      APP_NAME: IRLIX Recruitment
      APP_KEY: base64:9Hj76n6mO7S7r+L2E7jC0tI6Oq8mYWV7u4qKk2JcA+M=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-irlix_services}
      DB_USERNAME: ${RECRUITMENT_DB_USER:-recruitment_app}
      DB_PASSWORD: ${RECRUITMENT_DB_PASSWORD:-recruitment_local}
      DB_SEARCH_PATH: recruitment
      SESSION_DRIVER: array
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: sync
      KEYCLOAK_URL: http://keycloak:8080/keycloak/auth
      KEYCLOAK_ISSUER: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}/keycloak/auth/realms/irlix
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-irlix}
      KEYCLOAK_CLIENT_ID: irlix-services-web
      EMPLOYEES_URL: http://employees:8000/api
      SPECIALISTS_URL: http://specialists:8000/api
      IRLIX_INTERNAL_PURGE_TOKEN: ${IRLIX_INTERNAL_PURGE_TOKEN:-irlix-local-purge-token}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_started }
      employees: { condition: service_started }
      specialists: { condition: service_started }
    ports: ["127.0.0.1:8094:8000"]

  recruitment-web:
    build:
      context: .
      dockerfile: apps/recruitment/Dockerfile
    restart: unless-stopped
    depends_on: [recruitment]
    ports: ["127.0.0.1:8095:80"]

  portal:
    depends_on:
      - recruitment
      - recruitment-web

  timesheets-reconcile:
    build: { context: ./services/timesheets }
    restart: unless-stopped
    command: ["php", "/app/bin/reconcile-assignments.php"]
    environment:
      APP_NAME: IRLIX Timesheets Sync
      APP_KEY: base64:Y4U4VqjzQG7qN2pA7A0p56r9xjK6V/0zsF2xS8m5qGc=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-irlix_services}
      DB_USERNAME: ${TIMESHEETS_DB_USER:-timesheets_app}
      DB_PASSWORD: ${TIMESHEETS_DB_PASSWORD:-timesheets_local}
      DB_SEARCH_PATH: timesheets
      CACHE_STORE: array
      CLIENTS_INTERNAL_URL: http://clients:8000/internal
      IRLIX_TIMESHEETS_INTEGRATION_TOKEN: ${IRLIX_TIMESHEETS_INTEGRATION_TOKEN:-irlix-local-timesheets-token}
      TIMESHEETS_RECONCILE_INTERVAL: 60
    depends_on:
      postgres: { condition: service_healthy }
      clients: { condition: service_started }
      timesheets: { condition: service_started }
