# Pilot-only Storage, physically isolated from business services.
# Separate root port for Filestash because upstream does not support URL subpaths.
services:
  storage-s3:
    build:
      context: .
      dockerfile: infra/storage/seaweedfs/Dockerfile
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY:?Storage pilot access key is not provisioned}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:?Storage pilot secret key is not provisioned}
      WEED_ADMIN_PASSWORD: ${STORAGE_S3_ADMIN_PASSWORD:?Storage pilot admin password is not provisioned}
      S3_BUCKET: ${STORAGE_S3_BUCKET:-irlix-storage-pilot}
    volumes:
      - ${STORAGE_S3_DATA_DIR:?Storage pilot data mount is not provisioned}:/data
    ports:
      - "127.0.0.1:8113:8333"
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "test -d /data && test -w /data"]
      interval: 30s
      timeout: 5s
      retries: 4

  storage-web:
    build:
      context: .
      dockerfile: infra/storage/filestash/Dockerfile
    restart: unless-stopped
    depends_on:
      storage-s3:
        condition: service_started
    environment:
      CONFIG_SECRET: ${STORAGE_FILESTASH_CONFIG_SECRET:?Filestash encryption key missing}
      ADMIN_PASSWORD: ${STORAGE_FILESTASH_ADMIN_HASH:?Filestash admin password hash missing}
      # The only middleware config values persisted to disk are nonsecret
      # passthrough strategy + endpoint. S3 credentials are read by AWS SDK
      # server-side from environment, never from browser parameters.
      CONFIG_ENCRYPT: "false"
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY:?Storage S3 access key missing}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:?Storage S3 secret key missing}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - storage_filestash_state:/app/data/state
    ports:
      - "127.0.0.1:8111:8334"
    mem_limit: 512m
    cpus: 1.0


  # Read-only metadata and small synthetic pilot object operations. The API
  # revalidates the Employees cookie on each call; S3 keys never reach browsers.
  storage-api:
    build:
      context: .
      dockerfile: services/storage-api/Dockerfile
    restart: unless-stopped
    depends_on:
      storage-s3:
        condition: service_started
      employees:
        condition: service_started
    environment:
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?Storage pilot access key missing}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?Storage pilot secret key missing}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-irlix-storage-pilot}
      STORAGE_S3_ENDPOINT: http://storage-s3:8333
      STORAGE_EMPLOYEES_GATE: http://employees:8000/_storage_pilot_access
      STORAGE_PUBLIC_ORIGIN: ${IRLIX_CANONICAL_ORIGIN:-http://services.lan}:8110
    ports:
      - "127.0.0.1:8114:8000"
    mem_limit: 256m
    cpus: 0.75

  # Own UI replaces Filestash on the guarded :8110 ingress. Filestash's
  # existing state/container remains intact for technical operator testing.
  storage-drive:
    build:
      context: .
      dockerfile: apps/storage/Dockerfile
    restart: unless-stopped
    depends_on:
      storage-api:
        condition: service_started
    ports:
      - "127.0.0.1:8115:80"
    mem_limit: 128m
    cpus: 0.5

volumes:
  storage_filestash_state:
