name: QA

on:
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      scope:
        description: QA scope (all or named service)
        type: choice
        required: true
        default: all
        options: [all, ui, auth, employees, clients, timesheets, migration, portal, vacations, equipment, specialists, recruitment, cv]

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: QA report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build new System frontend
        run: |
          npm ci --prefix apps/system --no-audit --no-fund
          if [ ! -e node_modules ]; then ln -s apps/system/node_modules node_modules; fi
          npm run build --prefix apps/system
      - name: Validate AI orchestration syntax
        run: node --check scripts/agents/handoff.mjs && node --check scripts/agents/route.mjs
      - name: Select and run QA checks
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'changed' }}
        run: node scripts/qa/run.mjs --scope "$QA_SCOPE"
      - name: Lint backend PHP files
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'changed' }}
        run: node scripts/qa/php-lint.mjs --scope "$QA_SCOPE"
      - name: Test Migration coordinator semantics
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'migration') || github.event_name == 'pull_request' }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_migration_control.py' -v
      - name: Verify Keycloak authorization rollout safety
        run: python3 -m unittest discover -s scripts/tests -p 'test_keycloak_authz_rollout.py' -v
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: .qa-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14


  migration-domain:
    name: Migration PHP integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'migration')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Migration changes
        id: migration-scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$QA_BASE" HEAD | grep -q '^services/migration/'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test Laravel Migration service
        if: ${{ github.event_name != 'pull_request' || steps.migration-scope.outputs.changed == 'true' }}
        run: docker build --target app --tag irlix-migration-integration -f services/migration/Dockerfile services/migration

  browser:
    name: QA browser report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic localhost Playwright checks
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'changed' }}
        run: node scripts/qa/browser.mjs --scope "$QA_SCOPE"
      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-report
          path: .qa-results/browser/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
