name: Client summary and history validation
on:
  pull_request:
    branches: [development]
    paths:
      - 'apps/clients/**'
      - 'packages/ui/**'
      - 'services/clients/**'
      - '.github/workflows/client-history-ui-check.yml'

permissions:
  contents: read

concurrency:
  group: client-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected Clients frontend builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      enabled: ${{ steps.select.outputs.enabled }}
      php: ${{ steps.select.outputs.php }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: python3 scripts/ci/workflow_scope.py client-history-ui-check --pr

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test packages/ui/tests/clientHistoryContract.test.mjs
  build:
    needs: scope
    if: ${{ needs.scope.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
      - name: Existing clients tests
        if: matrix.app == 'clients'
        working-directory: apps/clients
        run: npm test
  php-lint:
    needs: scope
    if: ${{ needs.scope.outputs.php == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP history and migration syntax
        run: |
          php -l services/clients/app/Http/Controllers/ClientCardController.php
          php -l services/clients/app/Http/Controllers/ClientsController.php
          php -l services/clients/app/Http/Controllers/ReportingPeriodsController.php
          php -l services/clients/app/Support/ClientHistory.php
          php -l services/clients/database/migrations/2026_10_11_000001_create_client_history_events.php
