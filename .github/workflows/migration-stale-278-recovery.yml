name: One-time safe Timesheets 278 recovery

# One-time production repair must never run automatically on a code push.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RECOVER_STALE_278 to allow the one-time recovery'
        type: string
        required: true

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ inputs.confirmation == 'RECOVER_STALE_278' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure production SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
      - name: Reconcile exclusively proven orphaned Timesheets dry-run
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$PORT" scripts/ci/reconcile_stale_timesheets_278.py "$USER@$HOST:/tmp/irlix-stale-278-recovery.py"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/irlix-services
          worker="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2=="irlix-services_migration-worker_1" {print $1; exit}')"
          ops="$(docker ps --format '{{.ID}} {{.Names}}' | awk '$2=="irlix-services_migration-ops_1" {print $1; exit}')"
          test -n "$worker" && test -n "$ops"
          chmod 600 /tmp/irlix-stale-278-recovery.py
          trap 'rm -f /tmp/irlix-stale-278-recovery.py' EXIT
          # Confirm exact abandoned dry-run and empty job queue BEFORE quiescing.
          docker exec -i "$ops" python3 - --preflight < /tmp/irlix-stale-278-recovery.py
          echo "Quiescing abandoned migration worker (not deleting its data)..."
          docker stop -t 25 "$worker" >/dev/null
          trap 'docker start "$worker" >/dev/null || true; rm -f /tmp/irlix-stale-278-recovery.py' EXIT
          # With the only worker stopped, revalidate and commit one-row reconciliation.
          docker exec -i "$ops" python3 - < /tmp/irlix-stale-278-recovery.py
          docker start "$worker" >/dev/null
          echo "Reconciliation completed."
          REMOTE
