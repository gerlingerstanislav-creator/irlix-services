name: Keycloak authorization safe triage
on:
  push:
    branches:
      - diagnostics/keycloak-authz-safe-triage-20261021
    paths:
      - .github/workflows/keycloak-safe-triage.yml
      - scripts/ci/keycloak-safe-triage.php

permissions:
  contents: read

concurrency:
  group: keycloak-readonly-triage
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only Employees sync and Keycloak API probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH for read-only production diagnosis
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -T 10 -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Read aggregate failure categories and Keycloak admin HTTP codes
        run: |
          set -eu
          ssh -T -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/irlix-services && COMPOSE="$(python3 scripts/ci/service_plan.py compose-args --env-file .env)" && if [ "$(id -u)" = 0 ]; then sh -c "$COMPOSE exec -T employees php"; else sudo -n sh -c "$COMPOSE exec -T employees php"; fi' \
            < scripts/ci/keycloak-safe-triage.php
      - name: Read-only probe from the authorization worker container
        run: |
          set -eu
          ssh -T -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/irlix-services && COMPOSE="$(python3 scripts/ci/service_plan.py compose-args --env-file .env)" && if [ "$(id -u)" = 0 ]; then sh -c "$COMPOSE exec -T employees-authorization-sync php"; else sudo -n sh -c "$COMPOSE exec -T employees-authorization-sync php"; fi' \
            < scripts/ci/keycloak-safe-triage.php
