name: Keycloak authorization integration
on:
  pull_request:
    branches: [development]
    paths:
      - 'services/platform-core/**'
      - 'services/migration/**'
      - 'infra/keycloak/**'
      - 'services/employees/**'
      - 'services/finance/**'
      - 'services/clients/**'
      - 'scripts/ci/keycloak_authz_smoke.py'
      - '.github/workflows/keycloak-authz.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-authz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected authorization images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      enabled: ${{ steps.select.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            python3 scripts/ci/workflow_scope.py keycloak-authz --base "$PR_BASE"
          else
            python3 scripts/ci/workflow_scope.py keycloak-authz
          fi

  admin-auth-images:
    needs: scope
    if: ${{ needs.scope.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute service authorization smoke in Docker
        run: docker build -t "irlix-auth-ci-${{ matrix.service }}" "services/${{ matrix.service }}"
  keycloak-real-jwt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Keycloak 26 with real imported IRLIX realm
        run: |
          docker run -d --name irlix-keycloak-ci \
            -p 127.0.0.1:18885:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-ephemeral-admin \
            -v "${PWD}/infra/keycloak/irlix-realm.json:/opt/keycloak/data/import/irlix-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.0 \
            start-dev --import-realm --http-relative-path=/keycloak/auth
      - name: Build Clients for end-to-end signed JWT middleware checks
        run: docker build -t irlix-auth-ci-clients services/clients
      - name: Check actual Keycloak roles in newly issued JWT
        env:
          KEYCLOAK_ADMIN_USERNAME: ci-admin
          KEYCLOAK_ADMIN_PASSWORD: ci-ephemeral-admin
        run: python3 scripts/ci/keycloak_authz_smoke.py
      - name: Show Keycloak diagnostics if failed
        if: failure()
        run: docker logs --tail 120 irlix-keycloak-ci
      - name: Stop test identity provider
        if: always()
        run: docker rm -f irlix-keycloak-ci || true
