name: PR task timing (no AI)

on:
  pull_request_target:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-task-timing-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  timing:
    name: Record task timing summary
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '<!-- irlix-time-event-v1 -->') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted development only (never PR head)
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update PR timings from GitHub server timestamps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agents/task-metrics-github.mjs
