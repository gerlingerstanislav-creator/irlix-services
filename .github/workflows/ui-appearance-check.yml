name: UI Appearance checks
on:
  pull_request:
    branches: [development]
    paths:
      - 'packages/ui/**'
      - 'apps/**/src/**'
      - 'apps/**/package.json'
      - '.github/workflows/ui-appearance-check.yml'
      - 'scripts/ci/workflow_scope.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-appearance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected frontend apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      enabled: ${{ steps.select.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            python3 scripts/ci/workflow_scope.py ui-appearance-check --pr
          else
            python3 scripts/ci/workflow_scope.py ui-appearance-check
          fi

  theme-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/ui/tests/theme.test.mjs packages/ui/tests/palette.test.mjs

  color-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze unique colors
        run: node scripts/color-inventory.mjs --out=color-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: color-inventory
          path: color-inventory.json

  appearance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report remaining visual token debt
        run: node scripts/audit-appearance.mjs --strict | tee appearance-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-audit
          path: appearance-audit.json

  frontend-build:
    needs: scope
    if: ${{ needs.scope.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Build frontend
        working-directory: apps/${{ matrix.app }}
        run: npm run build
