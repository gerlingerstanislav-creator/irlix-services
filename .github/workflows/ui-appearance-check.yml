name: UI Appearance checks
on:
  push:
    branches: [feature/platform-theme-typography]
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'apps/**/src/**'
      - 'apps/**/package.json'
      - '.github/workflows/ui-appearance-check.yml'
  workflow_dispatch:
jobs:
  theme-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/ui/tests/theme.test.mjs packages/ui/tests/palette.test.mjs
  color-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze unique colors
        run: node scripts/color-inventory.mjs --out=color-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: color-inventory
          path: color-inventory.json
  appearance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report remaining visual token debt
        run: node scripts/audit-appearance.mjs --strict | tee appearance-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: appearance-audit
          path: appearance-audit.json
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, clients, vacations, timesheets, specialists, recruitment, cv, portal, migration, design-system, equipment]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/${{ matrix.app }}
        run: npm run build
