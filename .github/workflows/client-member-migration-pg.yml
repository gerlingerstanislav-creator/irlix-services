name: ClientMember migration PostgreSQL rehearsal

on:
  pull_request:
    branches: [development]
    paths:
      - 'services/migration/**'
      - 'services/clients/database/migrations/**'
      - 'services/clients/app/**'
      - 'services/clients/tests/**'
      - 'services/timesheets/database/migrations/**'
      - 'services/timesheets/tests/**'
      - '.github/workflows/client-member-migration-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-member-pg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contract:
    name: Real PostgreSQL schema upgrade and migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rehearsal
          POSTGRES_PASSWORD: rehearsal_only
          POSTGRES_DB: client_member_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal -d client_member_rehearsal"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: rehearsal
      PGPASSWORD: rehearsal_only
      PGDATABASE: client_member_rehearsal
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - name: Build real Laravel images and run synthetic migration tests
        run: |
          docker build --pull -t irlix-clients-rehearsal services/clients
          docker build --pull -t irlix-timesheets-rehearsal services/timesheets
          docker build --pull -t irlix-migration-rehearsal services/migration
      - name: Stress 64k synthetic ClientMember facts and idempotent retry
        run: |
          docker run --rm --network none --memory 1g \
            -e MIGRATION_CLIENT_MEMBER_VOLUME_ROWS=64000 \
            irlix-migration-rehearsal php -d memory_limit=768M \
            /app/tests/client_member_import_smoke.php
      - name: Stream 250k synthetic rows with bounded memory
        run: |
          docker run --rm --network none --memory 256m \
            irlix-migration-rehearsal php -d memory_limit=192M \
            /app/tests/disk_grouping_250k_smoke.php
      - name: Prepare isolated PostgreSQL service schemas
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA clients'
          psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA timesheets'
      - name: Apply actual Clients and Timesheets Laravel migrations to PostgreSQL
        run: |
          for entry in clients timesheets; do
            docker run --rm --network host \
              -e APP_KEY -e APP_ENV=testing -e DB_CONNECTION=pgsql \
              -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
              -e DB_DATABASE="$PGDATABASE" -e DB_USERNAME="$PGUSER" \
              -e DB_PASSWORD="$PGPASSWORD" -e DB_SEARCH_PATH="$entry" \
              "irlix-${entry}-rehearsal" php artisan migrate --force
          done
      - name: Verify Eloquent business use cases on real PostgreSQL
        run: |
          docker run --rm --network host \
            -e APP_KEY -e APP_ENV=testing -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE="$PGDATABASE" -e DB_USERNAME="$PGUSER" \
            -e DB_PASSWORD="$PGPASSWORD" -e DB_SEARCH_PATH=clients \
            irlix-clients-rehearsal php /app/tests/postgres_eloquent_refactor_smoke.php
      - name: Seed disposable PostgreSQL members without projects
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SET search_path TO clients;
          INSERT INTO clients (id, name, account_employee_id, created_at, updated_at)
          VALUES (990001, 'Live PG No Projects', 990002, now(), now());
          INSERT INTO partners (id, name, active, created_at, updated_at)
          VALUES (990020, 'Live PG Partner Vendor', true, now(), now());
          INSERT INTO partner_specialists (id, partner_id, full_name, active, created_at, updated_at)
          VALUES (990022, 990020, 'Live PG Partner', true, now(), now());
          INSERT INTO client_members (id, client_id, employee_id, specialist_name, created_at, updated_at)
          VALUES (990010, 990001, 990011, 'Live PG Employee', now(), now());
          INSERT INTO client_members (id, client_id, partner_specialist_id, specialist_name, created_at, updated_at)
          VALUES (990012, 990001, 990022, 'Live PG Partner', now(), now());
          INSERT INTO member_terms
            (id, client_member_id, technology, level, hourly_rate, hours_per_day,
             valid_from, valid_to, created_at, updated_at)
          VALUES
            (990010, 990010, 'PHP', 'Senior', 123.45, 8.00,
             '2027-06-01', '2027-06-30', now(), now());
          SQL
      - name: Verify live Clients to Timesheets HTTP and failure contract
        run: |
          docker run -d --name irlix-clients-live-check --network host \
            -e APP_KEY -e APP_ENV=testing -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE="$PGDATABASE" -e DB_USERNAME="$PGUSER" \
            -e DB_PASSWORD="$PGPASSWORD" -e DB_SEARCH_PATH=clients \
            -e IRLIX_TIMESHEETS_INTEGRATION_TOKEN=synthetic_only_token_1234567890123456789 \
            irlix-clients-rehearsal php -S 127.0.0.1:18901 -t /app/public /app/public/index.php
          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18901/api/health >/dev/null; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 70 irlix-clients-live-check
            exit 1
          fi
          docker run --rm --network host \
            -e APP_KEY -e APP_ENV=testing -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE="$PGDATABASE" -e DB_USERNAME="$PGUSER" \
            -e DB_PASSWORD="$PGPASSWORD" -e DB_SEARCH_PATH=timesheets \
            -e CLIENTS_INTERNAL_URL=http://127.0.0.1:18901/internal \
            -e IRLIX_TIMESHEETS_INTEGRATION_TOKEN=synthetic_only_token_1234567890123456789 \
            irlix-timesheets-rehearsal php /app/tests/clients_directory_live_postgres_smoke.php
      - name: Stop disposable Clients integration API
        if: always()
        run: docker rm -f irlix-clients-live-check || true
      - name: Assert ClientMember PostgreSQL invariants (read only)
        run: |
          psql -v ON_ERROR_STOP=1 -f services/migration/tests/postgres_client_member_contract.sql
      - name: Re-apply schema migrations to verify non-destructive restart
        run: |
          for entry in clients timesheets; do
            docker run --rm --network host \
              -e APP_KEY -e APP_ENV=testing -e DB_CONNECTION=pgsql \
              -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
              -e DB_DATABASE="$PGDATABASE" -e DB_USERNAME="$PGUSER" \
              -e DB_PASSWORD="$PGPASSWORD" -e DB_SEARCH_PATH="$entry" \
              "irlix-${entry}-rehearsal" php artisan migrate --force
          done
          psql -v ON_ERROR_STOP=1 -f services/migration/tests/postgres_client_member_contract.sql
