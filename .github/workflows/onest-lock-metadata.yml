name: Onest lockfiles validation
on:
  push:
    branches: [fix/onest-lockfiles]
jobs:
  locks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, migration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Strict install
        working-directory: apps/${{ matrix.app }}
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
