name: Notify CI success

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  TELEGRAM_MESSAGE: GitHub - CServices - deploy successful

jobs:
  telegram:
    name: Notify Telegram
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check that a real deploy and production smoke succeeded
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          if jq -e 'any(.jobs[]; .name == "Pull and deploy affected components" and .conclusion == "success") and any(.jobs[]; .name == "Bootstrap authentication and verify stand" and .conclusion == "success")' <<<"$jobs" >/dev/null; then
            echo 'send=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Production deploy skipped or smoke not confirmed; no success message.'
            echo 'send=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Send success notification
        if: steps.deployment.outputs.send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eu
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TELEGRAM_MESSAGE}" \
            > /dev/null
