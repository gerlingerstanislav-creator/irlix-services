name: Finance validation
on:
  pull_request:
    branches: [development]
    paths:
      - 'apps/finance/**'
      - 'services/finance/**'
      - 'services/clients/**'
      - 'services/timesheets/**'
      - 'services/employees/**'
      - 'packages/ui/**'
      - 'docker-compose.finance.yml'
      - '.github/workflows/finance-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install and compile Finance Vue/Vite
        run: npm install --no-audit --no-fund && npm run build
        working-directory: apps/finance
      - name: Node Finance contract checks
        run: node --test apps/finance/tests/*.test.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Lint Finance, Clients and Timesheets PHP
        run: |
          find services/finance services/clients/routes services/clients/app/Http/Controllers/ReportingPeriodsController.php services/timesheets/routes/system.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.finance.yml config --quiet
      - name: Check deployment shell syntax
        run: sh -n scripts/deploy-from-ghcr.sh
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build Finance backend image
        run: docker build --pull -t irlix-finance-ci ./services/finance
