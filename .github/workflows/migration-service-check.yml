name: Migration service check

on:
  pull_request:
    paths:
      - 'services/migration/**'
      - 'docker-compose.migration.yml'
      - '.github/workflows/migration-service-check.yml'
  push:
    branches:
      - development
    paths:
      - 'services/migration/**'
      - 'docker-compose.migration.yml'
      - '.github/workflows/migration-service-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.migration.yml config >/dev/null
      - name: Build migration service
        run: docker build -t irlix-migration-check services/migration
