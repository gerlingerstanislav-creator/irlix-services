name: PR service routing (no AI)

# Trusted base-branch workflow: do not checkout or execute untrusted PR source.
on:
  pull_request_target:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ai-team-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  handoff:
    name: Label task scopes for ChatGPT chats
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base SHA only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Post/upsert role handoff (no LLM invoked)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agents/handoff.mjs
