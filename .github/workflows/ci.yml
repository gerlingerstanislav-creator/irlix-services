name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          test -f index.html
          grep -q '<!doctype html>' index.html
          grep -q '<title>IRLIX Services</title>' index.html

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Configure nginx
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            elif command -v sudo >/dev/null 2>&1 && sudo -n true; then
              SUDO="sudo"
            else
              echo "Deploy user is not root and passwordless sudo is unavailable."
              exit 1
            fi

            if ! command -v nginx >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
                $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
              else
                echo "Unsupported server: apt-get is not available and nginx is not installed."
                exit 1
              fi
            fi

            if ! command -v curl >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
                $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y curl
              fi
            fi

            $SUDO mkdir -p /var/www/irlix-services
            $SUDO chown "$(id -un):$(id -gn)" /var/www/irlix-services

            $SUDO tee /etc/nginx/sites-available/irlix-services >/dev/null <<EOF
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                root /var/www/irlix-services;
                index index.html;

                location / {
                    try_files $uri $uri/ =404;
                }
            }
            EOF

            $SUDO rm -f /etc/nginx/sites-enabled/default
            $SUDO ln -sfn /etc/nginx/sites-available/irlix-services /etc/nginx/sites-enabled/irlix-services
            $SUDO nginx -t
            $SUDO systemctl enable --now nginx
            $SUDO systemctl reload nginx
          '

      - name: Deploy
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" index.html             "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/irlix-services/index.html"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            test -s /var/www/irlix-services/index.html
            curl -fsS http://127.0.0.1/ | grep -q "IRLIX Services"
          '

      - name: CI completed
        run: echo "CI and deployment completed successfully"
