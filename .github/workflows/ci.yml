name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: irlix-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.detect.outputs.full }}
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      infra: ${{ steps.detect.outputs.infra }}
      auth: ${{ steps.detect.outputs.auth }}
      portal: ${{ steps.detect.outputs.portal }}
      web: ${{ steps.detect.outputs.web }}
      vacations: ${{ steps.detect.outputs.vacations }}
      design_system: ${{ steps.detect.outputs.design_system }}
      employees: ${{ steps.detect.outputs.employees }}
      platform_core: ${{ steps.detect.outputs.platform_core }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          full=false
          frontend=false
          backend=false
          infra=false
          auth=false
          portal=false
          web=false
          vacations=false
          design_system=false
          employees=false
          platform_core=false

          if [ "$EVENT_NAME" != "push" ] || [ -z "${BEFORE_SHA:-}" ] || echo "$BEFORE_SHA" | grep -Eq '^0+$'; then
            full=true
          else
            base_sha="$BEFORE_SHA"
            deployed_sha="$(
              curl -sSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20" \
              | jq -r --arg current "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha != $current) | .head_sha' \
              | head -n1 || true
            )"
            if [ -n "${deployed_sha:-}" ] && [ "$deployed_sha" != "null" ] && git cat-file -e "$deployed_sha^{commit}" 2>/dev/null; then
              base_sha="$deployed_sha"
            fi
            echo "Change detection base: $base_sha"
            changed="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
            printf 'Changed files since last successful deploy:\n%s\n' "$changed"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                apps/portal/*)
                  frontend=true; portal=true ;;
                apps/web/*)
                  frontend=true; web=true ;;
                apps/vacations/*)
                  frontend=true; vacations=true ;;
                apps/design-system/*)
                  frontend=true; design_system=true ;;
                packages/ui/*)
                  frontend=true; web=true; vacations=true; design_system=true ;;
                packages/auth/*)
                  frontend=true; auth=true; portal=true; web=true; vacations=true ;;
                services/employees/*)
                  backend=true; employees=true ;;
                services/vacations/*)
                  backend=true; vacations=true ;;
                services/platform-core/*)
                  backend=true; platform_core=true ;;
                infra/keycloak/*)
                  infra=true; auth=true ;;
                infra/*|docker-compose.yml|.env.example)
                  full=true; infra=true ;;
                .github/workflows/*|scripts/verify-stand.sh)
                  echo "Pipeline/verification-only change: $file; no application container rebuild required" ;;
                scripts/*)
                  echo "Unknown runtime impact for $file; using full pipeline"
                  full=true; infra=true ;;
                *.md|docs/*)
                  ;;
                *)
                  echo "Unknown impact for $file; using full pipeline"
                  full=true ;;
              esac
            done <<EOF
          $changed
          EOF
          fi

          if [ "$full" = true ]; then
            frontend=true; backend=true; infra=true; auth=true
            portal=true; web=true; vacations=true; design_system=true; employees=true; platform_core=true
          fi

          for key in full frontend backend infra auth portal web vacations design_system employees platform_core; do
            eval "value=\$$key"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build affected frontend applications
        if: needs.changes.outputs.frontend == 'true'
        env:
          PORTAL: ${{ needs.changes.outputs.portal }}
          WEB: ${{ needs.changes.outputs.web }}
          VACATIONS: ${{ needs.changes.outputs.vacations }}
          DESIGN_SYSTEM: ${{ needs.changes.outputs.design_system }}
        run: |
          set -eu
          services=""
          [ "$PORTAL" = true ] && services="$services portal"
          [ "$WEB" = true ] && services="$services web"
          [ "$VACATIONS" = true ] && services="$services vacations-web"
          [ "$DESIGN_SYSTEM" = true ] && services="$services design-system"
          echo "Frontend services:$services"
          docker compose --env-file .env.example build $services
      - name: No frontend changes
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend build required"

  backend:
    name: Build backend
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build affected backend services
        if: needs.changes.outputs.backend == 'true'
        env:
          EMPLOYEES: ${{ needs.changes.outputs.employees }}
          VACATIONS: ${{ needs.changes.outputs.vacations }}
          PLATFORM_CORE: ${{ needs.changes.outputs.platform_core }}
        run: |
          set -eu
          services=""
          [ "$EMPLOYEES" = true ] && services="$services employees employees-events"
          [ "$VACATIONS" = true ] && services="$services vacations"
          [ "$PLATFORM_CORE" = true ] && services="$services platform-core"
          echo "Backend services:$services"
          docker compose --env-file .env.example build $services
      - name: No backend changes
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend build required"

  infra:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Report scope
        run: echo "infra=${{ needs.changes.outputs.infra }} auth=${{ needs.changes.outputs.auth }} full=${{ needs.changes.outputs.full }}"

  deploy:
    name: Deploy affected services
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Prepare release archive and nginx config
        run: |
          tar --exclude=.git -czf /tmp/irlix-services.tgz .
          cat > /tmp/irlix-services-nginx.conf <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _ ${{ secrets.DEPLOY_HOST }};
              location /api/platform/ { proxy_pass http://127.0.0.1:8081/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/employees/ { proxy_pass http://127.0.0.1:8082/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/vacations/ { proxy_pass http://127.0.0.1:8086/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /keycloak/auth/ { proxy_pass http://127.0.0.1:8085/keycloak/auth/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
              location = /keycloak/auth { return 301 /keycloak/auth/; }
              location = /auth { return 404; }
              location /auth/ { return 404; }
              location /employees/ { proxy_pass http://127.0.0.1:8080/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /employees { return 301 /employees/; }
              location /vacations/ { proxy_pass http://127.0.0.1:8087/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /vacations { return 301 /vacations/; }
              location /design-system/ { proxy_pass http://127.0.0.1:8083/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /design-system { return 301 /design-system/; }
              location / { proxy_pass http://127.0.0.1:8084; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
          }
          NGINX
      - name: Upload release
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" /tmp/irlix-services.tgz /tmp/irlix-services-nginx.conf "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"
      - name: Deploy
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PORTAL: ${{ needs.changes.outputs.portal }}
          WEB: ${{ needs.changes.outputs.web }}
          VACATIONS: ${{ needs.changes.outputs.vacations }}
          DESIGN_SYSTEM: ${{ needs.changes.outputs.design_system }}
          EMPLOYEES: ${{ needs.changes.outputs.employees }}
          PLATFORM_CORE: ${{ needs.changes.outputs.platform_core }}
          AUTH: ${{ needs.changes.outputs.auth }}
        run: |
          services=""
          [ "$PORTAL" = true ] && services="$services portal"
          [ "$WEB" = true ] && services="$services web"
          [ "$VACATIONS" = true ] && services="$services vacations vacations-web"
          [ "$DESIGN_SYSTEM" = true ] && services="$services design-system"
          [ "$EMPLOYEES" = true ] && services="$services employees employees-events"
          [ "$PLATFORM_CORE" = true ] && services="$services platform-core"
          [ "$AUTH" = true ] && services="$services keycloak"
          printf -v remote_services '%q' "$services"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "FULL=$FULL EMPLOYEES=$EMPLOYEES VACATIONS=$VACATIONS SERVICES=$remote_services bash -s" <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            if ! command -v nginx >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || { ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; }; then
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y nginx docker.io docker-compose curl
            fi
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            $SUDO systemctl enable --now docker nginx
            $SUDO mkdir -p /opt/irlix-services
            $SUDO tar -xzf /tmp/irlix-services.tgz -C /opt/irlix-services
            if [ ! -f /opt/irlix-services/.env ]; then $SUDO cp /opt/irlix-services/.env.example /opt/irlix-services/.env; fi
            $SUDO cp /tmp/irlix-services-nginx.conf /etc/nginx/sites-available/irlix-services
            $SUDO ln -sfn /etc/nginx/sites-available/irlix-services /etc/nginx/sites-enabled/irlix-services
            $SUDO rm -f /etc/nginx/sites-enabled/default
            $SUDO nginx -t
            cd /opt/irlix-services
            if [ "$FULL" = true ]; then
              $SUDO $COMPOSE --env-file .env up -d --build --remove-orphans
            elif [ -n "${SERVICES# }" ]; then
              echo "Deploying affected services:$SERVICES"
              $SUDO $COMPOSE --env-file .env up -d --build $SERVICES
            else
              echo "No containers require rebuild/restart"
            fi
            if [ "$FULL" = true ] || [ "$VACATIONS" = true ]; then
              $SUDO $COMPOSE exec -T postgres sh /docker-entrypoint-initdb.d/001-init-schemas.sh < /dev/null
            fi
            if [ "$FULL" = true ] || [ "$EMPLOYEES" = true ]; then
              $SUDO $COMPOSE exec -T employees php artisan migrate --force < /dev/null
            fi
            if [ "$FULL" = true ] || [ "$VACATIONS" = true ]; then
              $SUDO $COMPOSE exec -T vacations php artisan migrate --force < /dev/null
            fi
            $SUDO systemctl reload nginx
          REMOTE

  auth:
    name: Bootstrap authentication and verify stand
    runs-on: ubuntu-latest
    needs: [changes, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      TEMP_ADMIN_PASSWORD: ${{ secrets.TEMP_ADMIN_PASSWORD }}
      KEYCLOAK_ADMIN_PWD: ${{ secrets.KEYCLOAK_ADMIN_PWD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Bootstrap Keycloak
        if: needs.changes.outputs.auth == 'true'
        run: |
          test -n "$SMTP_USER"
          test -n "$SMTP_PASSWORD"
          printf -v remote_app_password '%q' "$TEMP_ADMIN_PASSWORD"
          printf -v remote_console_password '%q' "$KEYCLOAK_ADMIN_PWD"
          printf -v remote_smtp_user '%q' "$SMTP_USER"
          printf -v remote_smtp_password '%q' "$SMTP_PASSWORD"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "IRLIX_TEMP_ADMIN_PASSWORD=$remote_app_password KEYCLOAK_ADMIN_PWD=$remote_console_password KEYCLOAK_SMTP_USER=$remote_smtp_user KEYCLOAK_SMTP_PASSWORD=$remote_smtp_password bash -s" <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            attempts=0
            until curl -fsS --max-time 5 http://127.0.0.1:8085/keycloak/auth/realms/master/.well-known/openid-configuration >/dev/null 2>&1; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 45 ]; then $SUDO $COMPOSE logs --tail=120 keycloak || true; exit 1; fi
              sleep 2
            done
            $SUDO $COMPOSE exec -T \
              -e IRLIX_TEMP_ADMIN_PASSWORD="$IRLIX_TEMP_ADMIN_PASSWORD" \
              -e KEYCLOAK_ADMIN_PWD="$KEYCLOAK_ADMIN_PWD" \
              -e KEYCLOAK_SMTP_HOST="smtp.yandex.ru" \
              -e KEYCLOAK_SMTP_PORT="465" \
              -e KEYCLOAK_SMTP_FROM="$KEYCLOAK_SMTP_USER" \
              -e KEYCLOAK_SMTP_FROM_DISPLAY_NAME="IRLIX" \
              -e KEYCLOAK_SMTP_USER="$KEYCLOAK_SMTP_USER" \
              -e KEYCLOAK_SMTP_PASSWORD="$KEYCLOAK_SMTP_PASSWORD" \
              -e KEYCLOAK_SMTP_STARTTLS="false" \
              -e KEYCLOAK_SMTP_SSL="true" \
              keycloak /bin/sh /opt/keycloak/irlix-infra/bootstrap.sh
          REMOTE
      - name: Authentication unchanged
        if: needs.changes.outputs.auth != 'true'
        run: echo "Keycloak bootstrap not required"
      - name: Verify stand
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sh /opt/irlix-services/scripts/verify-stand.sh'
