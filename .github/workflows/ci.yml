name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          test -f index.html
          grep -q '<!doctype html>' index.html
          grep -q '<title>IRLIX Services</title>' index.html

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect server and nginx
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            echo "=== processes ==="
            ps -ef | grep -E "[n]ginx|[a]pache|[d]ocker|[c]addy" || true

            echo "=== nginx version/config ==="
            nginx -V 2>&1 || true
            nginx -T 2>&1 | sed -n "1,240p" || true

            echo "=== nginx files ==="
            find /etc/nginx -maxdepth 3 -type f -print 2>/dev/null | sort || true

            echo "=== docker ==="
            docker ps --format "table {{.Names}}\\t{{.Image}}\\t{{.Ports}}" 2>&1 || true

            echo "=== network identity ==="
            hostname
            hostname -I 2>/dev/null || true
            curl -4 -s --max-time 5 https://api.ipify.org 2>/dev/null || true
            echo
            echo "=== listening ports ==="
            (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null || true)
            echo "=== local HTTP ==="
            curl -i --max-time 5 http://127.0.0.1/ 2>&1 || true
            echo "=== public HTTP endpoint ==="
            curl -i --max-time 10 http://109.195.203.123/ 2>&1 || true
            echo "=== public HTTPS endpoint ==="
            curl -k -i --max-time 10 https://109.195.203.123/ 2>&1 || true
            echo "=== runtime/container identity ==="
            id
            uname -a
            systemd-detect-virt 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            echo "=== mounts ==="
            mount 2>/dev/null | head -100 || true
            echo "=== host-like mounts ==="
            ls -la /host /mnt /run/host 2>&1 || true
            echo "=== candidate html files ==="
            find / -maxdepth 4 -name index.html -type f 2>/dev/null | head -100 || true
          '

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'mkdir -p ~/irlix-services'
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" index.html \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/irlix-services/index.html"

      - name: Verify remote file
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'test -s ~/irlix-services/index.html'

      - name: CI completed
        run: echo "CI and deployment completed successfully"
