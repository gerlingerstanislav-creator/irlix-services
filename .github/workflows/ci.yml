name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: irlix-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build stack
        run: docker compose --env-file .env.example build

  deploy:
    name: Deploy stand
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare release archive and nginx config
        run: |
          tar --exclude=.git -czf /tmp/irlix-services.tgz .
          cat > /tmp/irlix-services-nginx.conf <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location /api/platform/ {
                  proxy_pass http://127.0.0.1:8081/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }

              location /api/employees/ {
                  proxy_pass http://127.0.0.1:8082/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
          NGINX

      - name: Upload release
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" /tmp/irlix-services.tgz /tmp/irlix-services-nginx.conf \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"

      - name: Deploy stack
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi

            if ! command -v nginx >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || { ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; }; then
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y nginx docker.io docker-compose curl
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            $SUDO systemctl enable --now docker nginx
            $SUDO mkdir -p /opt/irlix-services
            $SUDO tar -xzf /tmp/irlix-services.tgz -C /opt/irlix-services
            if [ ! -f /opt/irlix-services/.env ]; then
              $SUDO cp /opt/irlix-services/.env.example /opt/irlix-services/.env
            fi

            $SUDO cp /tmp/irlix-services-nginx.conf /etc/nginx/sites-available/irlix-services
            $SUDO ln -sfn /etc/nginx/sites-available/irlix-services /etc/nginx/sites-enabled/irlix-services
            $SUDO rm -f /etc/nginx/sites-enabled/default
            $SUDO nginx -t

            cd /opt/irlix-services
            $SUDO $COMPOSE --env-file .env up -d --build --force-recreate --remove-orphans
            $SUDO systemctl reload nginx
          '

      - name: Verify stand
        env:
          STAND_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi

            $SUDO $COMPOSE ps

            check_url() {
              url="$1"
              service="$2"
              pattern="$3"
              response="$(curl -fsS --retry 6 --retry-delay 2 --max-time 10 "$url")" || {
                echo "Verification request failed: $url"
                $SUDO $COMPOSE ps
                $SUDO $COMPOSE logs --tail=120 "$service" || true
                exit 1
              }
              echo "$response" | grep -q "$pattern" || {
                echo "Unexpected response from $url: $response"
                $SUDO $COMPOSE logs --tail=120 "$service" || true
                exit 1
              }
            }

            check_url http://127.0.0.1:8080/ web "IRLIX Services"
            check_url http://127.0.0.1:8081/api/health platform-core "ok"
            check_url http://127.0.0.1:8082/api/health employees "ok"
            check_url http://127.0.0.1/ web "IRLIX Services"
            check_url http://127.0.0.1/api/platform/health platform-core "ok"
            check_url http://127.0.0.1/api/employees/health employees "ok"
          '
          curl -fsS --retry 5 --retry-delay 3 --max-time 10 "http://${STAND_HOST}/" | grep -q "IRLIX Services"
