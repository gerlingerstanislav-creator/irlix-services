name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
    # Always run on documentation-only changes too: main requires CI verified on exact SHA.
  workflow_dispatch:
    inputs:
      full:
        description: Explicit full build
        type: boolean
        default: false
      deploy_release:
        description: Internal release workflow only — deploy main after fast-forward
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

# Development may replace obsolete checks; a started main release finishes.
concurrency:
  group: irlix-services-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  provenance:
    name: Main commit originates in development
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify main is from development
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_release == true) }}
        run: |
          git fetch origin development
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/development; then
            echo "::error::main commit is not in development history. Refusing production deploy."
            exit 1
          fi

  changes:
    name: Detect changes and validate registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_images: ${{ steps.detect.outputs.has_images }}
      deploy: ${{ steps.detect.outputs.deploy }}
      auth: ${{ steps.detect.outputs.auth }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Employees frontend regression tests
        run: |
          node --test apps/web/tests/staffTree.test.js
          node --test apps/web/tests/employeeStatusFilter.test.js
          node --test apps/web/tests/employeeManagementActions.test.js
      - name: Brandbook catalog and routing tests
        run: |
          node --test apps/brandbook/tests/*.test.js
          php services/employees/tests/brandbook_access.php
          php services/employees/tests/design_system_access.php
          php services/employees/tests/platform_roles.php
          php services/employees/tests/eloquent_architecture.php
      - name: Shared UI regression tests
        run: node --test packages/ui/tests/*.test.*
      - name: Shared auth regression tests
        run: node --test packages/auth/tests/*.test.mjs
      - name: Timesheets frontend regression tests
        run: node --test apps/timesheets/tests/*.test.mjs
      - name: Recruitment authorization regression tests
        run: node --test apps/recruitment/tests/*.test.mjs
      - name: Vacations permission and navigation regression tests
        run: node --test apps/vacations/tests/*.test.mjs
      - name: Planner regression tests
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_BUILD: ${{ inputs.full || false }}
        run: |
          args=()
          if [ "$FULL_BUILD" = true ]; then args+=(--full); fi
          # The event base SHA can be stale if development moves while the
          # PR's synthetic merge ref is generated. Its first parent is the
          # EXACT development commit used by the checkout under test.
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            read -r merge_commit base_sha pr_head extra <<< "$(git rev-list --parents -n 1 HEAD)"
            test -n "$pr_head" && test -z "$extra"
            args+=(--base "$base_sha")
          fi
          python3 scripts/ci/service_plan.py plan "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-plan
          path: .ci/deploy-plan.json
          include-hidden-files: true
          retention-days: 7

  build:
    name: Build or reuse / ${{ matrix.id }}
    if: ${{ needs.changes.outputs.has_images == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.skip != true
      - uses: ./.github/actions/build-service
        if: matrix.skip != true
        with:
          component: ${{ toJSON(matrix) }}
          token: ${{ github.token }}
      - name: No image build required
        if: matrix.skip == true
        run: echo 'Only configuration/diagnostics changed; no image builds.'

  snapshot-runtime:
    name: Migration rollback Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: contains(needs.changes.outputs.matrix, 'migration-ops')
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse restore in isolated synthetic Docker containers
        run: python3 scripts/tests/migration_restore_runtime_integration.py

  qa:
    name: QA checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve actual QA diff base
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            read -r merge_commit base_sha pr_head extra <<< "$(git rev-list --parents -n 1 HEAD)"
            test -n "$pr_head" && test -z "$extra"
            echo "QA_BASE=$base_sha" >> "$GITHUB_ENV"
          else
            echo "QA_BASE=$PUSH_BASE" >> "$GITHUB_ENV"
          fi
      - name: Validate AI orchestration syntax
        run: node --check scripts/agents/handoff.mjs && node --check scripts/agents/route.mjs
      - name: Run scoped QA contract checks
        run: node scripts/qa/run.mjs --scope changed
      - name: Lint changed backend PHP files
        run: node scripts/qa/php-lint.mjs --scope changed
      - name: Authorization V2 read-only parity guard tests
        run: php scripts/tests/authz_parity.php
      - name: Offline migration and infrastructure regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_migration_control.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_migration_retention.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_keycloak_authz_rollout.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_authz_v2_activation.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_authz_production_preflight.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_app_key_provisioning.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_resource_host_disk.py' -v
          PYTHONPATH=services/resource-monitor python3 -m unittest discover -s services/resource-monitor -p 'tests.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_prune_docker_images.py' -v
          sh -n scripts/server-storage-maintenance.sh
      - name: Store QA report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: .qa-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  qa-browser:
    name: QA browser scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve actual QA diff base
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            read -r merge_commit base_sha pr_head extra <<< "$(git rev-list --parents -n 1 HEAD)"
            test -n "$pr_head" && test -z "$extra"
            echo "QA_BASE=$base_sha" >> "$GITHUB_ENV"
          else
            echo "QA_BASE=$PUSH_BASE" >> "$GITHUB_ENV"
          fi
      - name: Run local synthetic Playwright scenarios
        run: node scripts/qa/browser.mjs --scope changed
      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-report
          path: .qa-results/browser/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  verified:
    name: CI verified
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [changes, build, provenance, snapshot-runtime, qa, qa-browser]
    if: ${{ !cancelled() }}
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HAS_IMAGES: ${{ needs.changes.outputs.has_images }}
          PROVENANCE_RESULT: ${{ needs.provenance.result }}
          SNAPSHOT_RESULT: ${{ needs.snapshot-runtime.result }}
          QA_RESULT: ${{ needs.qa.result }}
          QA_BROWSER_RESULT: ${{ needs.qa-browser.result }}
        run: test "$CHANGES_RESULT" = success && { test "$BUILD_RESULT" = success || { test "$BUILD_RESULT" = skipped && test "$HAS_IMAGES" = false; }; } && test "$PROVENANCE_RESULT" = success && test "$QA_RESULT" = success && test "$QA_BROWSER_RESULT" = success && { test "$SNAPSHOT_RESULT" = success || test "$SNAPSHOT_RESULT" = skipped; }

  deploy:
    name: Pull and deploy affected components
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, verified]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.verified.result == 'success' && (github.event_name == 'push' || inputs.deploy_release == true) && github.ref == 'refs/heads/main' && (needs.changes.outputs.deploy == 'true' || contains(github.event.head_commit.message, '[migration-test-snapshot]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deploy-plan
          path: .ci
      - name: Configure SSH
        timeout-minutes: 2
        env: { SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -T 10 -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload release and plan
        timeout-minutes: 5
        run: |
          tar --exclude=.git -czf "/tmp/irlix-release-${GITHUB_RUN_ID}.tgz" .
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" "/tmp/irlix-release-${GITHUB_RUN_ID}.tgz" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"
      - name: Transfer verified GHCR images to server
        timeout-minutes: 50
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bash scripts/ci/transfer-release-images.sh
      - name: Deploy verified images
        timeout-minutes: 18
        env:
          IRLIX_LOCAL_URL: ${{ secrets.IRLIX_LOCAL_URL }}
        run: |
          set -eu
          test -n "$IRLIX_LOCAL_URL"
          case "$IRLIX_LOCAL_URL" in
            http://*|https://*) public_url="${IRLIX_LOCAL_URL%/}" ;;
            *) public_url="http://${IRLIX_LOCAL_URL%/}" ;;
          esac
          printf -v remote_public_url '%q' "$public_url"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_SHA=$GITHUB_SHA IRLIX_PUBLIC_URL=$remote_public_url IRLIX_IMAGES_PRELOADED=1 bash -s" <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            if ! command -v nginx >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1 || { ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; }; then
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y nginx docker.io docker-compose curl python3
            fi
            $SUDO systemctl enable --now docker nginx
            $SUDO mkdir -p /opt/irlix-services
            $SUDO tar -xzf "/tmp/irlix-release-${GITHUB_RUN_ID}.tgz" -C /opt/irlix-services
            if [ ! -f /opt/irlix-services/.env ]; then $SUDO cp /opt/irlix-services/.env.example /opt/irlix-services/.env; fi
            cd /opt/irlix-services
            sh scripts/deploy-from-ghcr.sh
          REMOTE

  auth:
    name: Bootstrap authentication and verify stand
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, deploy]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.deploy_release == true) && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure' || needs.deploy.result == 'skipped') }}
    env:
      TEMP_ADMIN_PASSWORD: ${{ secrets.TEMP_ADMIN_PASSWORD }}
      KEYCLOAK_ADMIN_PWD: ${{ secrets.KEYCLOAK_ADMIN_PWD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Configure SSH
        timeout-minutes: 2
        env: { SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -T 10 -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Bootstrap Keycloak
        timeout-minutes: 8
        if: needs.deploy.result == 'success' && needs.changes.outputs.auth == 'true'
        run: |
          test -n "$SMTP_USER"; test -n "$SMTP_PASSWORD"
          printf -v remote_app_password '%q' "$TEMP_ADMIN_PASSWORD"; printf -v remote_console_password '%q' "$KEYCLOAK_ADMIN_PWD"; printf -v remote_smtp_user '%q' "$SMTP_USER"; printf -v remote_smtp_password '%q' "$SMTP_PASSWORD"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "IRLIX_TEMP_ADMIN_PASSWORD=$remote_app_password KEYCLOAK_ADMIN_PWD=$remote_console_password KEYCLOAK_SMTP_USER=$remote_smtp_user KEYCLOAK_SMTP_PASSWORD=$remote_smtp_password bash -s" <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            attempts=0
            until curl -fsS --max-time 5 http://127.0.0.1:8085/keycloak/auth/realms/master/.well-known/openid-configuration >/dev/null 2>&1; do attempts=$((attempts + 1)); if [ "$attempts" -ge 45 ]; then $SUDO $COMPOSE logs --tail=120 keycloak || true; exit 1; fi; sleep 2; done
            $SUDO $COMPOSE exec -T -e IRLIX_TEMP_ADMIN_PASSWORD="$IRLIX_TEMP_ADMIN_PASSWORD" -e KEYCLOAK_ADMIN_PWD="$KEYCLOAK_ADMIN_PWD" -e KEYCLOAK_SMTP_HOST="smtp.yandex.ru" -e KEYCLOAK_SMTP_PORT="465" -e KEYCLOAK_SMTP_FROM="$KEYCLOAK_SMTP_USER" -e KEYCLOAK_SMTP_FROM_DISPLAY_NAME="IRLIX" -e KEYCLOAK_SMTP_USER="$KEYCLOAK_SMTP_USER" -e KEYCLOAK_SMTP_PASSWORD="$KEYCLOAK_SMTP_PASSWORD" -e KEYCLOAK_SMTP_STARTTLS="false" -e KEYCLOAK_SMTP_SSL="true" keycloak /bin/sh /opt/keycloak/irlix-infra/bootstrap.sh
          REMOTE
      - name: Authentication unchanged
        if: needs.changes.outputs.auth != 'true'
        run: echo "Keycloak bootstrap not required"
      - uses: actions/checkout@v4
      # A script-only release has no image builds and no deploy, but authorized
      # diagnostic updates still need fresh production evidence. Stream the
      # reviewed Python source from this exact main SHA, never write to host.
      # Opt-in avoids a new SSH job for unrelated documentation/UI changes.
      - name: Read-only production AuthZ diagnostics for script-only release
        if: needs.deploy.result == 'skipped' && contains(github.event.head_commit.message, '[authz-probe]')
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/irlix-services && if [ "$(id -u)" -eq 0 ]; then python3 -; else sudo -n python3 -; fi' \
            < scripts/authz/inspect_runtime.py
      - name: Activate verified Keycloak authorization after bootstrap
        timeout-minutes: 12
        if: needs.deploy.result == 'success'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IRLIX_RELEASE_SHA=$GITHUB_SHA sh /opt/irlix-services/scripts/activate-keycloak-authorization.sh"
      - name: Verify stand
        timeout-minutes: 7
        if: needs.deploy.result == 'success'
        run: ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'cd /opt/irlix-services && sh scripts/verify-stand.sh && sh scripts/verify-timesheets.sh && python3 scripts/ci/verify_plan.py'
      - name: Verify deployed Employees navigation in Chromium
        # Browser navigation must also be verified after a test-only release with no image changes.
        if: needs.deploy.result == 'success' || needs.deploy.result == 'skipped'
        timeout-minutes: 5
        env:
          IRLIX_LOCAL_URL: ${{ secrets.IRLIX_LOCAL_URL }}
        run: |
          set -eu
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix /tmp/irlix-browser-check --no-audit --no-fund playwright@1.56.1
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" -o ExitOnForwardFailure=yes -fN -L 18080:127.0.0.1:80 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chrome_bin" NODE_PATH=/tmp/irlix-browser-check/node_modules node scripts/ci/check_employees_navigation.cjs
      - name: Protected AuthZ V2 snapshot and isolated restore preflight
        # Opt-in only: this is safe for an unchanged production image, and
        # leaves V2 flags disabled. Never invoked for routine releases.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && contains(github.event.head_commit.message, '[authz-preflight]') }}
        timeout-minutes: 30
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/irlix-services && if [ "$(id -u)" -eq 0 ]; then python3 -; else sudo -n python3 -; fi' \
            < scripts/authz/production_preflight.py
      - name: Activate independent AuthZ V2 service matrices in production
        # Explicit release opt-in; never run on regular builds or development.
        # The host script verifies protected snapshots + each live flag and
        # rolls back only flags changed by this invocation on failure.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && contains(github.event.head_commit.message, '[authz-v2-cutover]') }}
        timeout-minutes: 30
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/irlix-services && if [ "$(id -u)" -eq 0 ]; then python3 -; else sudo -n python3 -; fi' \
            < scripts/authz/activate_local_v2.py
      - name: Snapshot Employees before test migration
        timeout-minutes: 60
        if: needs.deploy.result == 'success' && contains(github.event.head_commit.message, '[migration-test-snapshot]')
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/irlix-services && if [ \$(id -u) -eq 0 ]; then GITHUB_SHA=$GITHUB_SHA python3 scripts/migration_test_snapshot.py $GITHUB_RUN_ID; else sudo -n env GITHUB_SHA=$GITHUB_SHA python3 scripts/migration_test_snapshot.py $GITHUB_RUN_ID; fi"
      - name: Restore legacy authorization if new JWT rollout fails acceptance
        if: failure() && needs.deploy.result == 'success'
        timeout-minutes: 8
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IRLIX_RELEASE_SHA=$GITHUB_SHA sh /opt/irlix-services/scripts/rollback-keycloak-authorization.sh"
