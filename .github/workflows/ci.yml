name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: irlix-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.detect.outputs.full }}
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend_matrix: ${{ steps.detect.outputs.frontend_matrix }}
      backend_matrix: ${{ steps.detect.outputs.backend_matrix }}
      infra: ${{ steps.detect.outputs.infra }}
      auth: ${{ steps.detect.outputs.auth }}
      portal: ${{ steps.detect.outputs.portal }}
      web: ${{ steps.detect.outputs.web }}
      vacations: ${{ steps.detect.outputs.vacations }}
      clients: ${{ steps.detect.outputs.clients }}
      timesheets: ${{ steps.detect.outputs.timesheets }}
      specialists: ${{ steps.detect.outputs.specialists }}
      recruitment: ${{ steps.detect.outputs.recruitment }}
      design_system: ${{ steps.detect.outputs.design_system }}
      employees: ${{ steps.detect.outputs.employees }}
      platform_core: ${{ steps.detect.outputs.platform_core }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          full=false; frontend=false; backend=false; infra=false; auth=false
          portal=false; web=false; vacations=false; clients=false; timesheets=false; specialists=false; recruitment=false
          design_system=false; employees=false; platform_core=false
          if [ "$EVENT_NAME" != "push" ] || [ -z "${BEFORE_SHA:-}" ] || echo "$BEFORE_SHA" | grep -Eq '^0+$'; then
            full=true
          else
            base_sha="$BEFORE_SHA"
            deployed_sha="$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20" | jq -r --arg current "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha != $current) | .head_sha' | head -n1 || true)"
            if [ -n "${deployed_sha:-}" ] && [ "$deployed_sha" != "null" ] && git cat-file -e "$deployed_sha^{commit}" 2>/dev/null; then base_sha="$deployed_sha"; fi
            changed="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
            printf 'Changed files since last successful deploy:\n%s\n' "$changed"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                apps/portal/*) frontend=true; portal=true ;;
                apps/web/*) frontend=true; web=true ;;
                apps/vacations/*) frontend=true; vacations=true ;;
                apps/clients/*) frontend=true; clients=true ;;
                apps/timesheets/*) frontend=true; timesheets=true ;;
                apps/specialists/*) frontend=true; specialists=true ;;
                apps/recruitment/*) frontend=true; recruitment=true ;;
                apps/design-system/*) frontend=true; design_system=true ;;
                packages/ui/*) frontend=true; portal=true; web=true; vacations=true; clients=true; timesheets=true; specialists=true; recruitment=true; design_system=true ;;
                packages/auth/*) frontend=true; auth=true; portal=true; web=true; vacations=true; clients=true; timesheets=true; specialists=true; recruitment=true ;;
                services/employees/*) backend=true; employees=true ;;
                services/vacations/*) backend=true; vacations=true ;;
                services/clients/*) backend=true; clients=true ;;
                services/timesheets/*) backend=true; timesheets=true ;;
                services/specialists/*) backend=true; specialists=true ;;
                services/recruitment/*) backend=true; recruitment=true ;;
                services/platform-core/*) backend=true; platform_core=true ;;
                infra/keycloak/*) infra=true; auth=true ;;
                infra/*|docker-compose.yml|docker-compose.override.yml|.env.example) full=true; infra=true ;;
                .github/workflows/*|scripts/verify-stand.sh|scripts/verify-timesheets.sh) infra=true ;;
                scripts/*) full=true; infra=true ;;
                *.md|docs/*) ;;
                *) full=true ;;
              esac
            done <<EOF
          $changed
          EOF
          fi
          if [ "$full" = true ]; then
            frontend=true; backend=true; infra=true; auth=true
            portal=true; web=true; vacations=true; clients=true; timesheets=true; specialists=true; recruitment=true
            design_system=true; employees=true; platform_core=true
          fi

          frontend_matrix='{"include":[]}'
          add_frontend() {
            frontend_matrix="$(printf '%s' "$frontend_matrix" | jq -c --arg name "$1" --arg compose "$2" '.include += [{"name":$name,"compose":$compose}]')"
          }
          [ "$portal" = true ] && add_frontend portal portal
          [ "$web" = true ] && add_frontend employees web
          [ "$vacations" = true ] && add_frontend vacations vacations-web
          [ "$clients" = true ] && add_frontend clients clients-web
          [ "$timesheets" = true ] && add_frontend timesheets timesheets-web
          [ "$specialists" = true ] && add_frontend specialists specialists-web
          [ "$recruitment" = true ] && add_frontend recruitment recruitment-web
          [ "$design_system" = true ] && add_frontend design-system design-system
          if [ "$(printf '%s' "$frontend_matrix" | jq '.include | length')" -eq 0 ]; then
            frontend_matrix='{"include":[{"name":"not-required","compose":"","skip":true}]}'
          fi

          backend_matrix='{"include":[]}'
          add_backend() {
            backend_matrix="$(printf '%s' "$backend_matrix" | jq -c --arg name "$1" --arg compose "$2" '.include += [{"name":$name,"compose":$compose}]')"
          }
          [ "$employees" = true ] && add_backend employees 'employees employees-events'
          [ "$vacations" = true ] && add_backend vacations vacations
          [ "$clients" = true ] && add_backend clients clients
          [ "$timesheets" = true ] && add_backend timesheets timesheets
          [ "$specialists" = true ] && add_backend specialists specialists
          [ "$recruitment" = true ] && add_backend recruitment recruitment
          [ "$platform_core" = true ] && add_backend platform-core platform-core
          if [ "$(printf '%s' "$backend_matrix" | jq '.include | length')" -eq 0 ]; then
            backend_matrix='{"include":[{"name":"not-required","compose":"","skip":true}]}'
          fi

          for key in full frontend backend infra auth portal web vacations clients timesheets specialists recruitment design_system employees platform_core; do eval "value=\$$key"; echo "$key=$value" >> "$GITHUB_OUTPUT"; done
          echo "frontend_matrix=$frontend_matrix" >> "$GITHUB_OUTPUT"
          echo "backend_matrix=$backend_matrix" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build frontend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.frontend_matrix) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.skip != true
      - name: Build ${{ matrix.name }} frontend
        if: matrix.skip != true
        env:
          COMPOSE_SERVICES: ${{ matrix.compose }}
        run: docker compose --env-file .env.example build $COMPOSE_SERVICES
      - name: No frontend build required
        if: matrix.skip == true
        run: echo "No frontend build required"

  backend:
    name: Build backend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.backend_matrix) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.skip != true
      - name: Build ${{ matrix.name }} backend
        if: matrix.skip != true
        env:
          COMPOSE_SERVICES: ${{ matrix.compose }}
        run: docker compose --env-file .env.example build $COMPOSE_SERVICES
      - name: No backend build required
        if: matrix.skip == true
        run: echo "No backend build required"

  infra:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet

  deploy:
    name: Deploy affected services
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env: { SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Prepare release archive and nginx config
        run: |
          tar --exclude=.git -czf /tmp/irlix-services.tgz .
          cat > /tmp/irlix-services-nginx.conf <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _ ${{ secrets.DEPLOY_HOST }};
              location /api/platform/ { proxy_pass http://127.0.0.1:8081/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/employees/ { proxy_pass http://127.0.0.1:8082/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/vacations/ { proxy_pass http://127.0.0.1:8086/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/clients/ { proxy_pass http://127.0.0.1:8088/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/timesheets/ { proxy_pass http://127.0.0.1:8090/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/specialists/ { proxy_pass http://127.0.0.1:8092/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /keycloak/auth/ { proxy_pass http://127.0.0.1:8085/keycloak/auth/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
              location = /keycloak/auth { return 301 /keycloak/auth/; }
              location = /auth { return 404; }
              location /auth/ { return 404; }
              location /employees/ { proxy_pass http://127.0.0.1:8080/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /employees { return 301 /employees/; }
              location /vacations/ { proxy_pass http://127.0.0.1:8087/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /vacations { return 301 /vacations/; }
              location /clients/ { proxy_pass http://127.0.0.1:8089/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /clients { return 301 /clients/; }
              location /timesheets/ { proxy_pass http://127.0.0.1:8091/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /timesheets { return 301 /timesheets/; }
              location /specialists/ { proxy_pass http://127.0.0.1:8093/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /specialists { return 301 /specialists/; }
              location /design-system/ { proxy_pass http://127.0.0.1:8083/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /design-system { return 301 /design-system/; }
              location / { proxy_pass http://127.0.0.1:8084; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
          }
          NGINX
      - name: Upload release
        run: scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" /tmp/irlix-services.tgz /tmp/irlix-services-nginx.conf "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"
      - name: Deploy
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PORTAL: ${{ needs.changes.outputs.portal }}
          WEB: ${{ needs.changes.outputs.web }}
          VACATIONS: ${{ needs.changes.outputs.vacations }}
          CLIENTS: ${{ needs.changes.outputs.clients }}
          TIMESHEETS: ${{ needs.changes.outputs.timesheets }}
          SPECIALISTS: ${{ needs.changes.outputs.specialists }}
          DESIGN_SYSTEM: ${{ needs.changes.outputs.design_system }}
          EMPLOYEES: ${{ needs.changes.outputs.employees }}
          PLATFORM_CORE: ${{ needs.changes.outputs.platform_core }}
          AUTH: ${{ needs.changes.outputs.auth }}
          IRLIX_LOCAL_URL: ${{ secrets.IRLIX_LOCAL_URL }}
        run: |
          set -eu
          test -n "$IRLIX_LOCAL_URL"
          case "$IRLIX_LOCAL_URL" in
            http://*|https://*) public_url="${IRLIX_LOCAL_URL%/}" ;;
            *) public_url="http://${IRLIX_LOCAL_URL%/}" ;;
          esac
          services=""
          [ "$PORTAL" = true ] && services="$services portal"
          [ "$WEB" = true ] && services="$services web"
          [ "$VACATIONS" = true ] && services="$services vacations vacations-web"
          [ "$CLIENTS" = true ] && services="$services clients clients-web"
          [ "$TIMESHEETS" = true ] && services="$services timesheets timesheets-web"
          [ "$SPECIALISTS" = true ] && services="$services specialists specialists-web"
          [ "$DESIGN_SYSTEM" = true ] && services="$services design-system"
          [ "$EMPLOYEES" = true ] && services="$services employees employees-events"
          [ "$PLATFORM_CORE" = true ] && services="$services platform-core"
          [ "$AUTH" = true ] && services="$services keycloak"
          printf -v remote_services '%q' "$services"
          printf -v remote_public_url '%q' "$public_url"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "FULL=$FULL EMPLOYEES=$EMPLOYEES VACATIONS=$VACATIONS CLIENTS=$CLIENTS TIMESHEETS=$TIMESHEETS SPECIALISTS=$SPECIALISTS SERVICES=$remote_services IRLIX_PUBLIC_URL=$remote_public_url bash -s" <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            if ! command -v nginx >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || { ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; }; then
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y nginx docker.io docker-compose curl
            fi
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            $SUDO systemctl enable --now docker nginx
            $SUDO mkdir -p /opt/irlix-services
            $SUDO tar -xzf /tmp/irlix-services.tgz -C /opt/irlix-services
            if [ ! -f /opt/irlix-services/.env ]; then $SUDO cp /opt/irlix-services/.env.example /opt/irlix-services/.env; fi
            upsert_env() {
              key="$1"; value="$2"; file=/opt/irlix-services/.env
              if $SUDO grep -q "^${key}=" "$file"; then
                escaped=$(printf '%s' "$value" | sed 's/[&|\\]/\\&/g')
                $SUDO sed -i "s|^${key}=.*|${key}=${escaped}|" "$file"
              else
                printf '%s=%s\n' "$key" "$value" | $SUDO tee -a "$file" >/dev/null
              fi
            }
            upsert_env IRLIX_PUBLIC_URL "$IRLIX_PUBLIC_URL"
            upsert_env KEYCLOAK_PUBLIC_URL "${IRLIX_PUBLIC_URL}/keycloak/auth"
            upsert_env KEYCLOAK_ISSUER "${IRLIX_PUBLIC_URL}/keycloak/auth/realms/irlix"
            for entry in 'TIMESHEETS_DB_USER=timesheets_app' 'TIMESHEETS_DB_PASSWORD=timesheets_local' 'SPECIALISTS_DB_USER=specialists_app' 'SPECIALISTS_DB_PASSWORD=specialists_local'; do key="${entry%%=*}"; grep -q "^${key}=" /opt/irlix-services/.env || echo "$entry" | $SUDO tee -a /opt/irlix-services/.env >/dev/null; done
            $SUDO cp /tmp/irlix-services-nginx.conf /etc/nginx/sites-available/irlix-services
            $SUDO ln -sfn /etc/nginx/sites-available/irlix-services /etc/nginx/sites-enabled/irlix-services
            $SUDO rm -f /etc/nginx/sites-enabled/default
            $SUDO nginx -t
            cd /opt/irlix-services
            if [ "$FULL" = true ]; then $SUDO $COMPOSE --env-file .env up -d --build --remove-orphans; elif [ -n "${SERVICES# }" ]; then $SUDO $COMPOSE --env-file .env up -d --build $SERVICES; fi
            if [ "$FULL" = true ] || [ "$VACATIONS" = true ] || [ "$CLIENTS" = true ] || [ "$TIMESHEETS" = true ] || [ "$SPECIALISTS" = true ]; then $SUDO $COMPOSE exec -T postgres sh /docker-entrypoint-initdb.d/001-init-schemas.sh < /dev/null; fi
            if [ "$FULL" = true ] || [ "$EMPLOYEES" = true ]; then $SUDO $COMPOSE exec -T employees php artisan migrate --force < /dev/null; fi
            if [ "$FULL" = true ] || [ "$VACATIONS" = true ]; then $SUDO $COMPOSE exec -T vacations php artisan migrate --force < /dev/null; fi
            if [ "$FULL" = true ] || [ "$CLIENTS" = true ]; then $SUDO $COMPOSE exec -T clients php artisan migrate --force < /dev/null; fi
            if [ "$FULL" = true ] || [ "$TIMESHEETS" = true ]; then $SUDO $COMPOSE exec -T timesheets php artisan migrate --force < /dev/null; fi
            if [ "$FULL" = true ] || [ "$SPECIALISTS" = true ]; then $SUDO $COMPOSE exec -T specialists php artisan migrate --force < /dev/null; fi
            $SUDO systemctl reload nginx
          REMOTE

  auth:
    name: Bootstrap authentication and verify stand
    runs-on: ubuntu-latest
    needs: [changes, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      TEMP_ADMIN_PASSWORD: ${{ secrets.TEMP_ADMIN_PASSWORD }}
      KEYCLOAK_ADMIN_PWD: ${{ secrets.KEYCLOAK_ADMIN_PWD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Configure SSH
        env: { SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}" }
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Bootstrap Keycloak
        if: needs.changes.outputs.auth == 'true'
        run: |
          test -n "$SMTP_USER"; test -n "$SMTP_PASSWORD"
          printf -v remote_app_password '%q' "$TEMP_ADMIN_PASSWORD"; printf -v remote_console_password '%q' "$KEYCLOAK_ADMIN_PWD"; printf -v remote_smtp_user '%q' "$SMTP_USER"; printf -v remote_smtp_password '%q' "$SMTP_PASSWORD"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "IRLIX_TEMP_ADMIN_PASSWORD=$remote_app_password KEYCLOAK_ADMIN_PWD=$remote_console_password KEYCLOAK_SMTP_USER=$remote_smtp_user KEYCLOAK_SMTP_PASSWORD=$remote_smtp_password bash -s" <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            attempts=0
            until curl -fsS --max-time 5 http://127.0.0.1:8085/keycloak/auth/realms/master/.well-known/openid-configuration >/dev/null 2>&1; do attempts=$((attempts + 1)); if [ "$attempts" -ge 45 ]; then $SUDO $COMPOSE logs --tail=120 keycloak || true; exit 1; fi; sleep 2; done
            $SUDO $COMPOSE exec -T -e IRLIX_TEMP_ADMIN_PASSWORD="$IRLIX_TEMP_ADMIN_PASSWORD" -e KEYCLOAK_ADMIN_PWD="$KEYCLOAK_ADMIN_PWD" -e KEYCLOAK_SMTP_HOST="smtp.yandex.ru" -e KEYCLOAK_SMTP_PORT="465" -e KEYCLOAK_SMTP_FROM="$KEYCLOAK_SMTP_USER" -e KEYCLOAK_SMTP_FROM_DISPLAY_NAME="IRLIX" -e KEYCLOAK_SMTP_USER="$KEYCLOAK_SMTP_USER" -e KEYCLOAK_SMTP_PASSWORD="$KEYCLOAK_SMTP_PASSWORD" -e KEYCLOAK_SMTP_STARTTLS="false" -e KEYCLOAK_SMTP_SSL="true" keycloak /bin/sh /opt/keycloak/irlix-infra/bootstrap.sh
          REMOTE
      - name: Authentication unchanged
        if: needs.changes.outputs.auth != 'true'
        run: echo "Keycloak bootstrap not required"
      - name: Verify stand
        run: ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sh /opt/irlix-services/scripts/verify-stand.sh && sh /opt/irlix-services/scripts/verify-timesheets.sh'
