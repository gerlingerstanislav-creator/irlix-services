name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: irlix-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Build affected services
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "push" ] || [ -z "${BEFORE_SHA:-}" ] || echo "$BEFORE_SHA" | grep -Eq '^0+$'; then
            echo "Full build: non-push/manual/initial event"
            docker compose --env-file .env.example build
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          printf 'Changed files:\n%s\n' "$changed"

          if echo "$changed" | grep -Eq '^(docker-compose\.yml|\.env\.example|infra/|\.github/workflows/)'; then
            echo "Full build: infrastructure changed"
            docker compose --env-file .env.example build
            exit 0
          fi

          services=""
          add_service() { case " $services " in *" $1 "*) ;; *) services="$services $1" ;; esac; }

          while IFS= read -r file; do
            case "$file" in
              apps/web/*) add_service web ;;
              apps/portal/*) add_service portal ;;
              apps/design-system/*) add_service design-system ;;
              packages/ui/*) add_service web; add_service design-system ;;
              packages/auth/*) add_service web; add_service portal ;;
              services/employees/*) add_service employees ;;
              services/platform-core/*) add_service platform-core ;;
              *.md|docs/*) ;;
              *) echo "Unknown build impact for $file; falling back to full build"; services="__all__"; break ;;
            esac
          done <<EOF
          $changed
          EOF

          if [ "$services" = "__all__" ]; then
            docker compose --env-file .env.example build
          elif [ -n "${services# }" ]; then
            echo "Building affected services:$services"
            docker compose --env-file .env.example build $services
          else
            echo "No buildable runtime changes detected"
          fi

  deploy:
    name: Deploy stand
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      TEMP_ADMIN_PASSWORD: ${{ secrets.TEMP_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Prepare release archive and nginx config
        run: |
          tar --exclude=.git -czf /tmp/irlix-services.tgz .
          cat > /tmp/irlix-services-nginx.conf <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _ ${{ secrets.DEPLOY_HOST }};
              location /api/platform/ { proxy_pass http://127.0.0.1:8081/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/employees/ { proxy_pass http://127.0.0.1:8082/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /auth/ { proxy_pass http://127.0.0.1:8085/auth/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
              location = /auth { return 301 /auth/; }
              location /employees/ { proxy_pass http://127.0.0.1:8080/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /employees { return 301 /employees/; }
              location /design-system/ { proxy_pass http://127.0.0.1:8083/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /design-system { return 301 /design-system/; }
              location / { proxy_pass http://127.0.0.1:8084; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
          }
          NGINX
      - name: Upload release
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT }}" /tmp/irlix-services.tgz /tmp/irlix-services-nginx.conf "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"
      - name: Deploy stack
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            if ! command -v nginx >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || { ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; }; then
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y nginx docker.io docker-compose curl
            fi
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            $SUDO systemctl enable --now docker nginx
            $SUDO mkdir -p /opt/irlix-services
            $SUDO tar -xzf /tmp/irlix-services.tgz -C /opt/irlix-services
            if [ ! -f /opt/irlix-services/.env ]; then $SUDO cp /opt/irlix-services/.env.example /opt/irlix-services/.env; fi
            $SUDO cp /tmp/irlix-services-nginx.conf /etc/nginx/sites-available/irlix-services
            $SUDO ln -sfn /etc/nginx/sites-available/irlix-services /etc/nginx/sites-enabled/irlix-services
            $SUDO rm -f /etc/nginx/sites-enabled/default
            $SUDO nginx -t
            cd /opt/irlix-services
            $SUDO $COMPOSE --env-file .env up -d --build --remove-orphans
            $SUDO $COMPOSE exec -T employees php artisan migrate --force
            $SUDO systemctl reload nginx
          REMOTE
      - name: Bootstrap Keycloak
        run: |
          printf -v remote_admin_password '%q' "$TEMP_ADMIN_PASSWORD"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "IRLIX_TEMP_ADMIN_PASSWORD=$remote_admin_password bash -s" <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            attempts=0
            until curl -fsS --max-time 5 http://127.0.0.1:8085/auth/realms/master/.well-known/openid-configuration >/dev/null 2>&1; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 45 ]; then $SUDO $COMPOSE logs --tail=120 keycloak || true; exit 1; fi
              sleep 2
            done
            $SUDO $COMPOSE exec -T -e IRLIX_TEMP_ADMIN_PASSWORD="$IRLIX_TEMP_ADMIN_PASSWORD" keycloak /bin/sh /opt/keycloak/irlix-infra/bootstrap.sh
          REMOTE
      - name: Verify stand
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            check_url() { response="$(curl -fsS --retry 20 --retry-all-errors --retry-delay 2 --max-time 10 "$1")" || { $SUDO $COMPOSE logs --tail=120 "$2" || true; exit 1; }; echo "$response" | grep -q "$3"; }
            check_status() { actual="$(curl -sS -o /dev/null -w "%{http_code}" --retry 8 --retry-all-errors --retry-delay 1 "$1")"; test "$actual" = "$2"; }
            check_url http://127.0.0.1/ portal "Dashboard"
            check_url http://127.0.0.1/employees/ web "IRLIX Services"
            check_url http://127.0.0.1/design-system/ design-system "IRLIX Design System"
            check_url http://127.0.0.1/auth/realms/irlix/.well-known/openid-configuration keycloak "issuer"
            check_url http://127.0.0.1/api/platform/health platform-core "ok"
            check_url http://127.0.0.1/api/employees/health employees "identity"
            check_status http://127.0.0.1/api/employees/departments 401
            check_status http://127.0.0.1/api/employees/employees 401
          REMOTE
