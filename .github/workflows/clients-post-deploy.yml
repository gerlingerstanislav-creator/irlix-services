name: Clients post-deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Migrate Clients and expose routes
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi

            $SUDO $COMPOSE --env-file .env exec -T clients php artisan migrate --force < /dev/null

            CONF=/etc/nginx/sites-available/irlix-services
            $SUDO python3 - "$CONF" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          api = '              location /api/clients/ { proxy_pass http://127.0.0.1:8088/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }\n'
          web = '              location /clients/ { proxy_pass http://127.0.0.1:8089/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }\n              location = /clients { return 301 /clients/; }\n'
          if 'location /api/clients/' not in text:
              text = text.replace('              location /keycloak/auth/', api + '              location /keycloak/auth/', 1)
          if 'location /clients/' not in text:
              text = text.replace('              location /design-system/', web + '              location /design-system/', 1)
          path.write_text(text)
          PY
            $SUDO nginx -t
            $SUDO systemctl reload nginx

            curl -fsS http://127.0.0.1:8088/api/health
            curl -fsS http://127.0.0.1:8089/ >/dev/null
          REMOTE
