name: Clients post-deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Migrate Clients, install and verify public routes
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
            set -eu
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
            cd /opt/irlix-services
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi

            $SUDO $COMPOSE --env-file .env exec -T clients php artisan migrate --force < /dev/null

            cat > /tmp/irlix-services-nginx.conf <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location /api/platform/ { proxy_pass http://127.0.0.1:8081/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/employees/ { proxy_pass http://127.0.0.1:8082/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/vacations/ { proxy_pass http://127.0.0.1:8086/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location /api/clients/ { proxy_pass http://127.0.0.1:8088/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

              location /keycloak/auth/ { proxy_pass http://127.0.0.1:8085/keycloak/auth/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
              location = /keycloak/auth { return 301 /keycloak/auth/; }
              location = /auth { return 404; }
              location /auth/ { return 404; }

              location /employees/ { proxy_pass http://127.0.0.1:8080/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /employees { return 301 /employees/; }
              location /vacations/ { proxy_pass http://127.0.0.1:8087/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /vacations { return 301 /vacations/; }
              location /clients/ { proxy_pass http://127.0.0.1:8089/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /clients { return 301 /clients/; }
              location /design-system/ { proxy_pass http://127.0.0.1:8083/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
              location = /design-system { return 301 /design-system/; }
              location / { proxy_pass http://127.0.0.1:8084; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
          }
          NGINX

            $SUDO cp /tmp/irlix-services-nginx.conf /etc/nginx/sites-available/irlix-services
            $SUDO ln -sfn /etc/nginx/sites-available/irlix-services /etc/nginx/sites-enabled/irlix-services
            $SUDO rm -f /etc/nginx/sites-enabled/default
            $SUDO nginx -t
            $SUDO systemctl reload nginx

            echo '[clients] direct backend health'
            curl -fsS http://127.0.0.1:8088/api/health

            echo '[clients] direct frontend'
            curl -fsS http://127.0.0.1:8089/ | grep -q 'IRLIX Clients'

            echo '[clients] public /clients redirect'
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: 192.168.90.100' http://127.0.0.1/clients)"
            [ "$code" = '301' ] || { echo "Expected /clients -> 301, got $code" >&2; exit 1; }

            echo '[clients] public frontend'
            curl -fsS -H 'Host: 192.168.90.100' http://127.0.0.1/clients/ | grep -q 'IRLIX Clients'

            echo '[clients] public API health'
            curl -fsS -H 'Host: 192.168.90.100' http://127.0.0.1/api/clients/health | grep -q 'clients'
          REMOTE
