name: Migration worker diagnostics (read-only)
# Temporary post-release production status probe, read-only; never merge this PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/migration-worker-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only migration heartbeat and worker diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure server SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          test -n "$SSH_KEY"; test -n "$DEPLOY_HOST"; test -n "$DEPLOY_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Inspect host containers and coordinator (no writes)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          cd /opt/irlix-services || { echo "PROBE_ERROR: project directory missing"; exit 2; }
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          COMPOSE="$(python3 scripts/ci/service_plan.py compose-args --env-file .env)"
          echo "PROBE_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for service in migration migration-worker migration-ops; do
            id=$($SUDO sh -c "$COMPOSE ps -q $service" 2>/dev/null || true)
            if [ -z "$id" ]; then echo "CONTAINER $service: missing"; continue; fi
            status=$($SUDO docker inspect --format '{{.State.Status}}' "$id" 2>/dev/null || echo unknown)
            restarts=$($SUDO docker inspect --format '{{.RestartCount}}' "$id" 2>/dev/null || echo unknown)
            echo "CONTAINER $service: status=$status restarts=$restarts"
          done
          if ! $SUDO sh -c "$COMPOSE exec -T migration-ops python3 -" <<'PY'
          import json, os, sqlite3, time
          from pathlib import Path
          now=time.time()
          def age(value):
              try: return max(0, int(now-float(value))) if value is not None else None
              except (TypeError,ValueError): return None
          def safe(value):
              return str(value)[:80] if value is not None else None
          try:
              state=json.loads(Path('/ops/console.json').read_text())
              op=state.get('operation') or {}
              print('COORDINATOR',json.dumps({
                  'id':safe(op.get('id')),'status':safe(op.get('status')),
                  'service':safe(op.get('current_service')),
                  'phase':safe(op.get('phase')),
                  'updated_age_s':age(op.get('updated_at')),
                  'started_age_s':age(op.get('started_at')),
                  'run_id':safe(op.get('current_run_id')),
                  'cancel_requested':bool(op.get('cancel_requested'))
              }))
          except Exception as e:
              print('COORDINATOR_ERROR',type(e).__name__)
              op={}
          current=op.get('current_run_id')
          try:
              path=Path(os.environ.get('MIGRATION_DATA_PATH','/data'))/'migration.sqlite'
              con=sqlite3.connect('file:'+str(path)+'?mode=ro',uri=True,timeout=3)
              con.row_factory=sqlite3.Row
              if current is None:
                  row=con.execute("SELECT id,service,mode,status,progress_phase,heartbeat_at,processed_count,created_at,started_at FROM migration_runs ORDER BY id DESC LIMIT 1").fetchone()
              else:
                  row=con.execute("SELECT id,service,mode,status,progress_phase,heartbeat_at,processed_count,created_at,started_at FROM migration_runs WHERE id=?", (current,)).fetchone()
              if row:
                  print('WORKER_RUN',json.dumps({
                      'id':row['id'],'service':row['service'],'mode':row['mode'],
                      'status':row['status'],'phase':row['progress_phase'],
                      'heartbeat_age_s':age(row['heartbeat_at']),
                      'started_age_s':age(row['started_at']),
                      'processed_count':row['processed_count']
                  }))
                  cols=[r[1] for r in con.execute('PRAGMA table_info(migration_table_progress)')]
                  if 'migration_run_id' in cols and 'processed_count' in cols:
                      aggregate=con.execute('SELECT count(*),sum(processed_count) FROM migration_table_progress WHERE migration_run_id=?',(row['id'],)).fetchone()
                      print('TABLE_PROGRESS',json.dumps({'tables':aggregate[0],'processed_sum':aggregate[1]}))
                      if 'updated_at' in cols:
                          recent=con.execute('SELECT max(updated_at) FROM migration_table_progress WHERE migration_run_id=?',(row['id'],)).fetchone()
                          print('TABLE_LAST_UPDATE',json.dumps({'updated_at':safe(recent[0])}))
              else: print('WORKER_RUN not_found')
              con.close()
          except Exception as e:
              print('WORKER_RUN_ERROR',type(e).__name__)
          PY
          then
            echo "PROBE_ERROR: coordinator inspection was not executed"
            exit 3
          fi
          worker_id=$($SUDO sh -c "$COMPOSE ps -q migration-worker" 2>/dev/null || true)
          if [ -n "$worker_id" ]; then
            worker_processes=$($SUDO docker top "$worker_id" -eo comm 2>/dev/null | grep -Ec '^php([0-9.]*)?$' || true)
            echo "WORKER_PHP_PROCESSES=$worker_processes"
          else
            echo "WORKER_PHP_PROCESSES=unknown_no_container"
          fi
          # Diagnose deployed runtime config without displaying any values
          # beyond this single non-secret feature flag.
          $SUDO sh -c "$COMPOSE exec -T migration-worker php artisan config:show migration.clients_defer_rate_amounts" </dev/null | grep -E -i 'true|false' || true
          # Private run #416. Report only fixed enum codes, allowlisted field
          # names and booleans. No source/target IDs or monetary values.
          if ! $SUDO sh -c "$COMPOSE exec -T migration-worker php" <<'PHP'
          <?php
          try {
              require_once '/app/vendor/autoload.php';
              $app=require '/app/bootstrap/app.php';
              $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $legacy=new \App\Migration\Core\LegacyReader('clients');
              $legacy->assertSafe();
              $metadata=new PDO('sqlite:file:/data/migration.sqlite?mode=ro', null, null,
                  [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $metadata->exec('PRAGMA query_only=ON');
              $query=$metadata->prepare(
                  "SELECT entity_type,legacy_id,code,context FROM migration_conflicts "
                  ."WHERE migration_run_id=? AND code IN "
                  ."('PROTECTED_REPORTING_PERIOD_CHANGE','RECONCILIATION_EVIDENCE_REQUIRED') "
                  ."AND severity='error' ORDER BY id LIMIT 10"
              );
              $query->execute([416]);
              $conflicts=$query->fetchAll(PDO::FETCH_ASSOC);
              if (count($conflicts)!==5) {
                  echo 'CLIENTS416_PROOF count_unexpected=' . count($conflicts) . "\n";
                  exit(2);
              }
              $host=getenv('TARGET_CLIENTS_DB_HOST')?:getenv('TARGET_SHARED_DB_HOST');
              $dbname=getenv('TARGET_CLIENTS_DB_DATABASE')?:getenv('TARGET_SHARED_DB_DATABASE');
              $port=getenv('TARGET_CLIENTS_DB_PORT')?:'5432';
              $user=getenv('TARGET_CLIENTS_DB_USERNAME');
              $password=getenv('TARGET_CLIENTS_DB_PASSWORD');
              if (!$host||!$dbname||!$user||$password===false) {
                  throw new RuntimeException('connection_unavailable');
              }
              $pg=new PDO("pgsql:host=$host;port=$port;dbname=$dbname;connect_timeout=5",
                  $user,$password,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $pg->beginTransaction();
              $pg->exec('SET TRANSACTION READ ONLY');
              $pg->exec('SET LOCAL statement_timeout = 5000');
              $allowedFields=[
                  'client_id','period_start','period_end','status','confirmed_hours',
                  'timesheets_sent_at','timesheets_approved_at','act_sent_at',
                  'act_approved_at','paid_at','hourly_rate','valid_from','valid_to',
                  'technology','level','hours_per_day','client_member_id'
              ];
              $allowedClasses=['source_delta','unchanged','needs_evidence','target_diverged'];
              $allowedReasons=['source_changed','target_changed','both_changed',
                  'baseline_missing','target_field_missing','equal'];
              $mappingQuery=$metadata->prepare(
                  "SELECT target_id,metadata FROM migration_mappings "
                  ."WHERE service='clients' AND entity_type=? AND legacy_id=?"
              );
              foreach ($conflicts as $item) {
                  $type=$item['entity_type'];
                  if (!in_array($type,['rates','reporting_periods'],true)) exit(3);
                  $context=json_decode((string)$item['context'],true) ?: [];
                  $mappingQuery->execute([$type,(string)$item['legacy_id']]);
                  $mapping=$mappingQuery->fetch(PDO::FETCH_ASSOC);
                  $meta=$mapping ? json_decode((string)$mapping['metadata'],true) : null;
                  $baseline=is_array($meta) && is_array($meta['target_payload']??null)
                      ?$meta['target_payload']:null;
                  $table=$type==='rates'?'clients.member_terms':'clients.reporting_periods';
                  $target=false;
                  if ($mapping && preg_match('/^\d+$/D',(string)$mapping['target_id'])) {
                      $row=$pg->prepare('SELECT * FROM '.$table.' WHERE id=?');
                      $row->execute([(string)$mapping['target_id']]);
                      $target=$row->fetch(PDO::FETCH_ASSOC);
                  }
                  $match=is_array($baseline) && $target!==false && count($baseline)>0;
                  $changedTargetFields=[];
                  if ($match) {
                      foreach ($baseline as $field=>$expected) {
                          if (!array_key_exists($field,$target) ||
                              !\App\Migration\Core\TargetFieldComparison::matches(
                                  $target[$field],$expected,$field)) {
                              $match=false;
                              if (in_array($field,$allowedFields,true)) $changedTargetFields[]=$field;
                          }
                      }
                  }
                  $sourceFields=array_values(array_filter($context['changed_fields']??[],
                      static fn($f)=>is_string($f) && in_array($f,$allowedFields,true)));
                  $provenance=$context['reconciliation_provenance']??[];
                  $class=$provenance['classification']??null;
                  $reasons=[];
                  foreach (($provenance['field_reasons']??[]) as $field=>$reason) {
                      if (in_array($field,$allowedFields,true)
                          && in_array($reason,$allowedReasons,true)) $reasons[$field]=$reason;
                  }
                  $freeze=false;
                  if ($type==='reporting_periods' && $target!==false) {
                      foreach (['timesheet_snapshot','timesheet_revision','timesheet_freeze_token'] as $field) {
                          if (($target[$field]??null)!==null) $freeze=true;
                      }
                      foreach (['reporting_period_history','reporting_period_approved_hours'] as $tableName) {
                          $lookup=$pg->prepare('SELECT EXISTS (SELECT 1 FROM clients.'.$tableName
                              .' WHERE reporting_period_id=?)');
                          $lookup->execute([(string)$mapping['target_id']]);
                          if ((bool)$lookup->fetchColumn()) $freeze=true;
                      }
                  }
                  $humanProof=null;
                  if ($type==='reporting_periods') {
                      $historical=$legacy->selectOne(
                          'SELECT approved_at,act_approval_at,act_approved_at,paid_at '
                          .'FROM public.reporting_periods WHERE id=?',
                          [(string)$item['legacy_id']]);
                      $humanProof=$historical ? [
                          'source_timesheets_approved'=>($historical->approved_at??null)!==null,
                          'source_act_sent'=>($historical->act_approval_at??null)!==null,
                          'source_act_approved'=>($historical->act_approved_at??null)!==null,
                          'source_paid'=>($historical->paid_at??null)!==null,
                          'previously_act_approved'=>is_array($meta)
                              && ($meta['source']['act_approved_at']??null)!==null,
                      ] : ['source_present'=>false];
                  }
                  echo 'CLIENTS416_PROOF '.json_encode([
                      'entity'=>$type,
                      'mapping_present'=>$mapping!==false,
                      'canonical_mapping'=>is_array($meta) && !isset($meta['alias_of']),
                      'target_present'=>$target!==false,
                      'baseline_present'=>$baseline!==null,
                      'baseline_field_count'=>$baseline===null?0:count($baseline),
                      'baseline_matches_target'=>$match,
                      'target_changed_fields'=>$changedTargetFields,
                      'candidate_changed_fields'=>$sourceFields,
                      'target_final'=>$type==='reporting_periods' && $target!==false
                          && in_array($target['status']??null,['Акт согласован','Счет оплачен'],true),
                      'native_approval_or_freeze'=>$freeze,
                      'provenance_class'=>in_array($class,$allowedClasses,true)?$class:null,
                      'provenance_field_reasons'=>$reasons,
                      'legacy_human_proof'=>$humanProof
                  ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              }
              $pg->rollBack();
              echo "CLIENTS416_READONLY_DONE\n";
          } catch(Throwable $e) {
              echo 'CLIENTS416_READONLY_FAILED '.get_class($e)."\n";
              exit(5);
          }
          PHP
          then
            echo 'CLIENTS416_READONLY_BLOCKED'
            exit 6
          fi
          echo "PROBE_FINISHED: no state changed"
          REMOTE
