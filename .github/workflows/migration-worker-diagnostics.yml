name: Migration worker diagnostics (read-only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/migration-worker-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only migration heartbeat and worker diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure server SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          test -n "$SSH_KEY"; test -n "$DEPLOY_HOST"; test -n "$DEPLOY_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 15\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Inspect host containers and coordinator (no writes)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          cd /opt/irlix-services || { echo "PROBE_ERROR: project directory missing"; exit 2; }
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          COMPOSE="$(python3 scripts/ci/service_plan.py compose-args --env-file .env)"
          echo "PROBE_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for service in migration migration-worker migration-ops; do
            id=$($SUDO sh -c "$COMPOSE ps -q $service" 2>/dev/null || true)
            if [ -z "$id" ]; then echo "CONTAINER $service: missing"; continue; fi
            status=$($SUDO docker inspect --format '{{.State.Status}}' "$id" 2>/dev/null || echo unknown)
            restarts=$($SUDO docker inspect --format '{{.RestartCount}}' "$id" 2>/dev/null || echo unknown)
            echo "CONTAINER $service: status=$status restarts=$restarts"
          done
          if ! $SUDO sh -c "$COMPOSE exec -T migration-ops python3 -" <<'PY'
          import json, os, sqlite3, time
          from pathlib import Path
          now=time.time()
          def age(value):
              try: return max(0, int(now-float(value))) if value is not None else None
              except (TypeError,ValueError): return None
          def safe(value):
              return str(value)[:80] if value is not None else None
          try:
              state=json.loads(Path('/ops/console.json').read_text())
              op=state.get('operation') or {}
              print('COORDINATOR',json.dumps({
                  'id':safe(op.get('id')),'status':safe(op.get('status')),
                  'service':safe(op.get('current_service')),
                  'phase':safe(op.get('phase')),
                  'updated_age_s':age(op.get('updated_at')),
                  'started_age_s':age(op.get('started_at')),
                  'run_id':safe(op.get('current_run_id')),
                  'cancel_requested':bool(op.get('cancel_requested'))
              }))
          except Exception as e:
              print('COORDINATOR_ERROR',type(e).__name__)
              op={}
          current=op.get('current_run_id')
          try:
              path=Path(os.environ.get('MIGRATION_DATA_PATH','/data'))/'migration.sqlite'
              con=sqlite3.connect('file:'+str(path)+'?mode=ro',uri=True,timeout=3)
              con.row_factory=sqlite3.Row
              if current is None:
                  row=con.execute("SELECT id,service,mode,status,progress_phase,heartbeat_at,processed_count,created_at,started_at FROM migration_runs ORDER BY id DESC LIMIT 1").fetchone()
              else:
                  row=con.execute("SELECT id,service,mode,status,progress_phase,heartbeat_at,processed_count,created_at,started_at FROM migration_runs WHERE id=?", (current,)).fetchone()
              if row:
                  print('WORKER_RUN',json.dumps({
                      'id':row['id'],'service':row['service'],'mode':row['mode'],
                      'status':row['status'],'phase':row['progress_phase'],
                      'heartbeat_age_s':age(row['heartbeat_at']),
                      'started_age_s':age(row['started_at']),
                      'processed_count':row['processed_count']
                  }))
                  cols=[r[1] for r in con.execute('PRAGMA table_info(migration_table_progress)')]
                  if 'migration_run_id' in cols and 'processed_count' in cols:
                      aggregate=con.execute('SELECT count(*),sum(processed_count) FROM migration_table_progress WHERE migration_run_id=?',(row['id'],)).fetchone()
                      print('TABLE_PROGRESS',json.dumps({'tables':aggregate[0],'processed_sum':aggregate[1]}))
                      if 'updated_at' in cols:
                          recent=con.execute('SELECT max(updated_at) FROM migration_table_progress WHERE migration_run_id=?',(row['id'],)).fetchone()
                          print('TABLE_LAST_UPDATE',json.dumps({'updated_at':safe(recent[0])}))
              else: print('WORKER_RUN not_found')
              # This diagnostic reveals only bounded enum counts for recent
              # Clients runs. No source IDs, raw context, financial amounts,
              # names, connection credentials, or SQL values leave the host.
              known_codes={
                  'PROTECTED_TERM_CHANGE','RECONCILIATION_EVIDENCE_REQUIRED',
                  'SOURCE_PERIOD_OVERLAP','CLIENTS_LEGACY_MAPPINGS_INCOMPATIBLE',
                  'MAPPED_TARGET_MISSING','MAPPED_CLIENT_MEMBER_MISSING',
                  'MAPPED_TERM_DATES_INVALID','PROTECTED_PERIOD_DATES_INVALID',
                  'IDENTITY_MAPPING_COLLISION','UNSAFE_PRIOR_WRITE',
                  'UNSEALED_LEGACY_PERIOD_CORRECTION',
              }
              try:
                  for item in con.execute(
                      "SELECT id,mode,status FROM migration_runs "
                      "WHERE service='clients' ORDER BY id DESC LIMIT 8"
                  ):
                      rid=int(item['id'])
                      counts={}
                      others=0
                      for code,count in con.execute(
                          "SELECT code,COUNT(*) FROM migration_conflicts "
                          "WHERE migration_run_id=? AND severity='error' "
                          "GROUP BY code",(rid,)
                      ):
                          if code in known_codes:
                              counts[code]=count
                          else:
                              others+=count
                      print('CLIENTS_READONLY_RECONCILIATION',json.dumps({
                          'run_id':rid,'mode':safe(item['mode']),
                          'status':safe(item['status']),
                          'blocked_codes':counts,'other_errors':others,
                      },sort_keys=True))
              except (sqlite3.Error,ValueError) as e:
                  print('CLIENTS_RECONCILIATION_ERROR',type(e).__name__)
              try:
                  latest=con.execute(
                      "SELECT id FROM migration_runs WHERE service='clients' "
                      "AND mode='dry-run' ORDER BY id DESC LIMIT 1"
                  ).fetchone()
                  if latest:
                      allowed_fields={'hourly_rate','valid_from','valid_to',
                          'client_member_id','technology','level','hours_per_day'}
                      allowed_reasons={'source_changed','target_changed','both_changed',
                          'baseline_missing','target_field_missing','equal'}
                      allowed_protection={'FINAL_OR_UNKNOWN_REPORTING_STATUS',
                          'PAID_REPORTING_PERIOD','NATIVE_TIMESHEETS_FREEZE',
                          'APPROVAL_PROOF_TABLE_MISSING','NATIVE_CLIENTS_REPORTING_HISTORY',
                          'NATIVE_APPROVED_HOURS','INVALID_REPORTING_MAPPING_METADATA',
                          'REPORTING_MAPPING_PROVENANCE_MISSING',
                          'TARGET_REPORTING_PERIOD_CHANGED',
                          'CANONICAL_REPORTING_MAPPING_NOT_UNIQUE',
                          'LEGACY_FINAL_STATUS_CHANGE'}
                      for (raw,) in con.execute(
                          "SELECT context FROM migration_conflicts WHERE "
                          "migration_run_id=? AND code='PROTECTED_TERM_CHANGE' "
                          "AND severity='error' LIMIT 3",(int(latest['id']),)
                      ):
                          context=json.loads(raw or '{}')
                          if not isinstance(context,dict): continue
                          provenance=context.get('reconciliation_provenance') or {}
                          if not isinstance(provenance,dict): provenance={}
                          reason=context.get('protection_reason')
                          classification=provenance.get('classification')
                          reasons=provenance.get('field_reasons') or {}
                          if not isinstance(reasons,dict): reasons={}
                          fields=context.get('changed_fields') or []
                          if not isinstance(fields,list): fields=[]
                          print('CLIENTS_PROTECTED_REASON',json.dumps({
                              'run_id':int(latest['id']),
                              'protection_reason':reason if reason in allowed_protection
                                  else 'UNKNOWN_OR_MISSING',
                              'changed_fields':sorted(x for x in fields
                                  if isinstance(x,str) and x in allowed_fields),
                              'classification':classification if classification in
                                  {'source_delta','target_diverged','needs_evidence','unchanged'}
                                  else 'UNKNOWN_OR_UNAVAILABLE',
                              'field_reasons':{k:v for k,v in reasons.items()
                                  if k in allowed_fields and v in allowed_reasons},
                          },sort_keys=True))
              except (sqlite3.Error,ValueError,TypeError) as e:
                  print('CLIENTS_PROTECTION_REASON_ERROR',type(e).__name__)
              con.close()
          except Exception as e:
              print('WORKER_RUN_ERROR',type(e).__name__)
          PY
          then
            echo "PROBE_ERROR: coordinator inspection was not executed"
            exit 3
          fi
          worker_id=$($SUDO sh -c "$COMPOSE ps -q migration-worker" 2>/dev/null || true)
          if [ -n "$worker_id" ]; then
            worker_processes=$($SUDO docker top "$worker_id" -eo comm 2>/dev/null | grep -Ec '^php([0-9.]*)?$' || true)
            echo "WORKER_PHP_PROCESSES=$worker_processes"
          else
            echo "WORKER_PHP_PROCESSES=unknown_no_container"
          fi
          # Read protected status by canonical migration mapping. Only categorical
          # status reaches CI logs; never export client/employee IDs or amounts.
          if ! $SUDO sh -c "$COMPOSE exec -T migration-worker php" <<'PHP'
          <?php
          try {
              $meta = new PDO('sqlite:file:/data/migration.sqlite?mode=ro');
              $meta->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
              $meta->exec('PRAGMA query_only=ON');
              $conflict = $meta->query(
                  "SELECT c.legacy_id,c.context FROM migration_conflicts c "
                  ."JOIN migration_runs r ON r.id=c.migration_run_id "
                  ."WHERE r.service='clients' AND r.mode='dry-run' "
                  ."AND c.code='PROTECTED_TERM_CHANGE' AND c.severity='error' "
                  ."ORDER BY c.migration_run_id DESC LIMIT 1"
              )->fetch(PDO::FETCH_ASSOC);
              if (!$conflict) {
                  echo "CLIENTS_PROTECTED_PERIOD_STATE not_found\n";
              } else {
                  $ctx=json_decode($conflict['context'] ?? '{}',true);
                  $period=is_array($ctx) ? ($ctx['protected_interval'] ?? []) : [];
                  $start=$period['from'] ?? null;
                  $end=$period['to'] ?? null;
                  if (!is_string($start) || !preg_match('/^\d{4}-\d{2}-\d{2}$/D',$start)
                      || !is_string($end) || !preg_match('/^\d{4}-\d{2}-\d{2}$/D',$end)) {
                      throw new RuntimeException('period_not_available');
                  }
                  $q=$meta->prepare(
                      "SELECT target_id FROM migration_mappings WHERE service='clients' "
                      ."AND entity_type='rates' AND legacy_id=? LIMIT 1"
                  );
                  $q->execute([(string)$conflict['legacy_id']]);
                  $targetId=$q->fetchColumn();
                  if (!is_string($targetId) || !preg_match('/^\d+$/D',$targetId)) {
                      throw new RuntimeException('mapping_unavailable');
                  }
                  $host=getenv('TARGET_CLIENTS_DB_HOST') ?: getenv('TARGET_SHARED_DB_HOST');
                  $dbname=getenv('TARGET_CLIENTS_DB_DATABASE') ?: getenv('TARGET_SHARED_DB_DATABASE');
                  $port=getenv('TARGET_CLIENTS_DB_PORT') ?: '5432';
                  $user=getenv('TARGET_CLIENTS_DB_USERNAME');
                  $password=getenv('TARGET_CLIENTS_DB_PASSWORD');
                  if (!$host || !$dbname || !$user || $password === false) {
                      throw new RuntimeException('target_connection_unavailable');
                  }
                  $pg=new PDO("pgsql:host=$host;port=$port;dbname=$dbname;connect_timeout=5",
                      $user,$password,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
                  $pg->beginTransaction();
                  $pg->exec('SET TRANSACTION READ ONLY');
                  $pg->exec('SET LOCAL statement_timeout = 5000');
                  $sql="SELECT p.id,p.status,p.paid_at,"
                      ."p.timesheet_snapshot,p.timesheet_revision,p.timesheet_freeze_token "
                      ."FROM clients.reporting_periods p "
                      ."JOIN clients.client_members m ON m.client_id=p.client_id "
                      ."JOIN clients.member_terms t ON t.client_member_id=m.id "
                      ."WHERE t.id=:id AND p.period_start::date=:from_date "
                      ."AND p.period_end::date=:to_date";
                  $q=$pg->prepare($sql);
                  $q->execute(['id'=>$targetId,'from_date'=>$start,'to_date'=>$end]);
                  $counts=[];
                  $proof=[];
                  $canon=$meta->prepare(
                      "SELECT metadata FROM migration_mappings WHERE service='clients' "
                      ."AND entity_type='reporting_periods' AND target_id=?"
                  );
                  $history=$pg->prepare(
                      "SELECT EXISTS(SELECT 1 FROM clients.reporting_period_history "
                      ."WHERE reporting_period_id=?)"
                  );
                  $approved=$pg->prepare(
                      "SELECT EXISTS(SELECT 1 FROM clients.reporting_period_approved_hours "
                      ."WHERE reporting_period_id=?)"
                  );
                  while ($row=$q->fetch(PDO::FETCH_ASSOC)) {
                      $status=$row['status'];
                      $category=match($status) {
                          'Счет оплачен'=>'finance_paid',
                          'Акт согласован'=>'act_approved',
                          'Акт на согласовании'=>'act_pending',
                          'ТШ согласованы'=>'timesheets_approved',
                          'ТШ на согласовании'=>'timesheets_pending',
                          'Новый'=>'new',
                          default=>'unknown',
                      };
                      $counts[$category]=($counts[$category]??0)+1;
                      $canon->execute([(string)$row['id']]);
                      $mapping=$canon->fetchAll(PDO::FETCH_COLUMN);
                      $matching=0;
                      foreach ($mapping as $item) {
                          $details=json_decode((string)$item,true);
                          if (is_array($details) && !isset($details['alias_of'])
                              && ($details['target_payload']['status']??null)===$status) {
                              ++$matching;
                          }
                      }
                      $history->execute([$row['id']]);
                      $approved->execute([$row['id']]);
                      $proof[]=[
                          'paid_at_present'=>$row['paid_at']!==null,
                          'native_timesheet_proof_present'=>($row['timesheet_snapshot']!==null
                              || $row['timesheet_revision']!==null
                              || $row['timesheet_freeze_token']!==null),
                          'native_clients_history_present'=>(bool)$history->fetchColumn(),
                          'native_approved_hours_present'=>(bool)$approved->fetchColumn(),
                          'canonical_metadata_status_matches'=>($matching===1),
                      ];
                  }
                  $pg->rollBack();
                  echo 'CLIENTS_PROTECTED_PERIOD_STATE '.json_encode([
                      'status_categories'=>$counts,
                      'matches'=>array_sum($counts),
                      'client_proof'=>$proof,
                      'finance_ledger_checked'=>false,
                  ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              }
          } catch (Throwable $e) {
              echo 'CLIENTS_PROTECTED_PERIOD_PROBE_ERROR '.get_class($e)."\n";
              exit(2);
          }
          PHP
          then
            echo "PROBE_ERROR: protected period categorization unavailable"
            exit 3
          fi
          # The paid status may have originated in legacy; verify whether
          # Finance recorded independent invoice/settlement facts. Transfer the
          # internal period ID only between containers; never print it in CI.
          period_id="$($SUDO sh -c "$COMPOSE exec -T migration-worker php" <<'PHP'
          <?php
          try {
              $meta=new PDO('sqlite:file:/data/migration.sqlite?mode=ro',null,null,
                  [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $meta->exec('PRAGMA query_only=ON');
              $conflict=$meta->query(
                  "SELECT c.legacy_id,c.context FROM migration_conflicts c "
                  ."JOIN migration_runs r ON r.id=c.migration_run_id "
                  ."WHERE r.service='clients' AND r.mode='dry-run' "
                  ."AND c.code='PROTECTED_TERM_CHANGE' AND c.severity='error' "
                  ."ORDER BY c.migration_run_id DESC LIMIT 1"
              )->fetch(PDO::FETCH_ASSOC);
              if (!$conflict) throw new RuntimeException('missing_conflict');
              $ctx=json_decode($conflict['context'],true);
              $range=$ctx['protected_interval']??[];
              $from=$range['from']??null; $to=$range['to']??null;
              if (!is_string($from) || !is_string($to) ||
                  !preg_match('/^\d{4}-\d{2}-\d{2}$/D',$from) ||
                  !preg_match('/^\d{4}-\d{2}-\d{2}$/D',$to)) {
                  throw new RuntimeException('missing_interval');
              }
              $q=$meta->prepare("SELECT target_id FROM migration_mappings "
                  ."WHERE service='clients' AND entity_type='rates' AND legacy_id=?");
              $q->execute([(string)$conflict['legacy_id']]);
              $rate=$q->fetchColumn();
              if (!is_string($rate) || !preg_match('/^\d+$/D',$rate)) {
                  throw new RuntimeException('unmapped_rate');
              }
              $host=getenv('TARGET_CLIENTS_DB_HOST')?:getenv('TARGET_SHARED_DB_HOST');
              $name=getenv('TARGET_CLIENTS_DB_DATABASE')?:getenv('TARGET_SHARED_DB_DATABASE');
              $user=getenv('TARGET_CLIENTS_DB_USERNAME');
              $pass=getenv('TARGET_CLIENTS_DB_PASSWORD');
              if (!$host||!$name||!$user||$pass===false) throw new RuntimeException('unavailable');
              $pg=new PDO("pgsql:host=$host;port=5432;dbname=$name;connect_timeout=5",
                  $user,$pass,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $pg->beginTransaction();
              $pg->exec('SET TRANSACTION READ ONLY');
              $pg->exec('SET LOCAL statement_timeout = 5000');
              $q=$pg->prepare("SELECT p.id FROM clients.reporting_periods p "
                  ."JOIN clients.client_members m ON m.client_id=p.client_id "
                  ."JOIN clients.member_terms t ON t.client_member_id=m.id "
                  ."WHERE t.id=? AND p.period_start::date=? AND p.period_end::date=?");
              $q->execute([$rate,$from,$to]);
              $ids=$q->fetchAll(PDO::FETCH_COLUMN);
              $pg->rollBack();
              if (count($ids)!==1 || !preg_match('/^\d+$/D',(string)$ids[0])) {
                  throw new RuntimeException('ambiguous_target_period');
              }
              echo (string)$ids[0];
          } catch (Throwable $e) {
              echo 'UNAVAILABLE';
              exit(2);
          }
          PHP
          )" || {
            echo "FINANCE_RECONCILIATION_PROBE_ERROR: target period lookup unavailable"
            exit 3
          }
          case "$period_id" in
            *[!0-9]*|"") echo "FINANCE_RECONCILIATION_PROBE_ERROR: invalid target reference"; exit 3;;
          esac
          if ! $SUDO sh -c "$COMPOSE exec -T -e RECONCILIATION_PERIOD_ID=$period_id finance php" <<'PHP'
          <?php
          try {
              $id=getenv('RECONCILIATION_PERIOD_ID');
              if (!$id || !preg_match('/^\d+$/D',$id)) throw new RuntimeException('no_period');
              $host=getenv('DB_HOST');
              $name=getenv('DB_DATABASE');
              $user=getenv('DB_USERNAME');
              $password=getenv('DB_PASSWORD');
              $port=getenv('DB_PORT')?:'5432';
              if (!$host||!$name||!$user||$password===false)
                  throw new RuntimeException('finance_connection_unavailable');
              $pg=new PDO("pgsql:host=$host;port=$port;dbname=$name;connect_timeout=5",
                  $user,$password,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $pg->beginTransaction();
              $pg->exec('SET TRANSACTION READ ONLY');
              $pg->exec('SET LOCAL statement_timeout = 5000');
              $q=$pg->prepare("SELECT COUNT(*) FROM finance.invoices WHERE reporting_period_id=?");
              $q->execute([$id]);
              $invoices=(int)$q->fetchColumn();
              $q=$pg->prepare(
                  "SELECT COUNT(*) FROM finance.payment_allocations a "
                  ."JOIN finance.invoices i ON i.id=a.invoice_id "
                  ."WHERE i.reporting_period_id=?"
              );
              $q->execute([$id]);
              $allocations=(int)$q->fetchColumn();
              $q=$pg->prepare(
                  "SELECT status FROM finance.finance_period_settlements "
                  ."WHERE reporting_period_id=? LIMIT 1"
              );
              $q->execute([$id]);
              $status=$q->fetchColumn();
              $pg->rollBack();
              echo 'FINANCE_PROTECTED_PERIOD_EVIDENCE '.json_encode([
                  'invoice_count'=>$invoices,'allocation_count'=>$allocations,
                  'settlement_state'=>in_array($status,['open','pending','synced'],true)
                      ?$status:'missing_or_unknown',
                  'read_only'=>true,
              ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          } catch(Throwable $e) {
              echo 'FINANCE_RECONCILIATION_PROBE_ERROR '.get_class($e)."\n";
              exit(2);
          }
          PHP
          then
            echo "PROBE_ERROR: Finance evidence check unavailable"
            exit 3
          fi
          # The main production smoke previously failed during this lookup,
          # so re-check the actual running container's independent write gate.
          ops_id="$($SUDO sh -c "$COMPOSE ps -q migration-ops")"
          if [ -z "$ops_id" ]; then
            echo "MIGRATION_DAILY_WRITE_GATE unknown_no_running_ops_container"
            exit 4
          fi
          if $SUDO docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$ops_id" |
            grep -Fxq 'MIGRATION_DAILY_WRITE_APPROVED=false'; then
            echo "MIGRATION_DAILY_WRITE_GATE disabled_confirmed"
          else
            echo "MIGRATION_DAILY_WRITE_GATE unsafe_or_unverified"
            exit 4
          fi
          echo "PROBE_FINISHED: no state changed"
          REMOTE
