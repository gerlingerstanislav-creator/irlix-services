name: Client member PostgreSQL validation

on:
  push:
    branches: [feature/partner-directory-20261023]
    # An operator can trigger the read-only actual-source rehearsal with an empty
    # signed commit; no code or production data needs to be modified.
  pull_request:
    branches: [development]
    paths: ['services/clients/**', 'services/timesheets/**', 'services/migration/**', 'scripts/ci/client-member-*', '.github/workflows/client-member-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-source-copy-dry-run:
    # Owner-authorized SELECT-only legacy snapshot; disposable target databases
    # may be cleared during empty-target rehearsal, but live DBs are never reset.
    # Source rehearsal validates UUID-confirmed employees and uniquely proven
    # Source rehearsal validates unique partner auto-matches against the current
    # A costly private rehearsal requires workflow_dispatch or an explicit
    # [source-dry-run] push marker; ordinary PR/feature pushes never obtain SSH.
    # PR jobs never receive SSH credentials.
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[source-dry-run]'))) && github.ref == 'refs/heads/feature/partner-directory-20261023' && github.repository == 'gerlingerstanislav-creator/irlix-services'
    runs-on: ubuntu-latest
    # Includes full Timesheets source scan and aggregate-only partner evidence.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build reviewed feature images before accessing private data
        run: |
          docker build --pull -t member-clients-ci services/clients
          docker build --pull -t member-timesheets-ci services/timesheets
          docker build --pull -t member-migration-ci services/migration
          docker pull postgres:16-alpine
      - name: Read-only export to private ephemeral runner and validate isolated copy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          task_private=$(mktemp -d)
          export CLIENT_MEMBER_PRIVATE_DIR="$task_private"
          trap 'rm -rf "$task_private"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$task_private/ssh-key"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$task_private/known-hosts" 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o UserKnownHostsFile="$task_private/known-hosts" -i "$task_private/ssh-key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'set -eu; if [ "$(id -u)" -eq 0 ]; then inv_sudo=""; else inv_sudo="sudo -n"; fi; inv_id=$($inv_sudo docker ps -q --filter label=com.docker.compose.service=migration); test "$(printf "%s\n" "$inv_id" | wc -l)" -eq 1; test -n "$inv_id"; inv_image=$($inv_sudo docker inspect --format "{{.Config.Image}}" "$inv_id"); case "$inv_image" in ghcr.io/gerlingerstanislav-creator/irlix-migration:*) ;; *) exit 2;; esac; $inv_sudo docker exec -i -e MIGRATION_SKIP_BOOTSTRAP=true "$inv_id" php' \
            < scripts/ci/client-member-source-snapshot.php > "$task_private/source.jsonl"
          rm -f "$task_private/ssh-key" "$task_private/known-hosts"
          unset SSH_KEY SSH_HOST SSH_PORT SSH_USER
          bash scripts/ci/client-member-copy.sh
      # Deliberately no upload-artifact, service logs or cache of private files.

  readonly-source-inventory:
    # Explicitly authorized diagnostics only; never expose SSH credentials to PRs.
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[source-dry-run]'))) && github.ref == 'refs/heads/feature/partner-directory-20261023' && github.repository == 'gerlingerstanislav-creator/irlix-services'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read schema and aggregate counts from current deployed Migration image
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/client-member-inventory
          chmod 600 ~/.ssh/client-member-inventory
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/client-member-inventory -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'set -eu; if [ "$(id -u)" -eq 0 ]; then inv_sudo=""; else inv_sudo="sudo -n"; fi; inv_id=$($inv_sudo docker ps -q --filter label=com.docker.compose.service=migration); test "$(printf "%s\n" "$inv_id" | wc -l)" -eq 1; test -n "$inv_id"; inv_image=$($inv_sudo docker inspect --format "{{.Config.Image}}" "$inv_id"); case "$inv_image" in ghcr.io/gerlingerstanislav-creator/irlix-migration:*) ;; *) echo "BLOCKED: unexpected deployed migration image"; exit 2;; esac; $inv_sudo docker inspect --format "Inventory uses deployed image {{.Image}}" "$inv_id"; $inv_sudo docker exec -i -e MIGRATION_SKIP_BOOTSTRAP=true "$inv_id" php' \
            < scripts/ci/client-member-source-inventory.php
          rm -f ~/.ssh/client-member-inventory

  upgrade-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: membership_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d membership_ci"
          --health-interval 3s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Clients (including route and migration regression tests)
        run: docker build --pull -t member-clients-ci services/clients
      - name: Build Timesheets (including permission and conversion recovery tests)
        run: docker build --pull -t member-timesheets-ci services/timesheets
      - name: Build Migration (including 63k aggregation and checkpoint tests)
        run: docker build --pull -t member-migration-ci services/migration
      - name: Upgrade populated PostgreSQL and test live service contracts
        run: bash scripts/ci/client-member-integration.sh
      - name: Upload synthetic integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-member-postgres-evidence
          path: /tmp/client-member-ci-evidence/*.log
          if-no-files-found: ignore
