name: Build local integration image with shared cache
description: Build a test-only Docker image using the same per-service BuildKit cache as CI.
inputs:
  service:
    description: Registered service id used as the shared cache scope
    required: true
  context:
    description: Docker build context
    required: true
  tag:
    description: Local test image tag
    required: true
  target:
    description: Optional Dockerfile target
    required: false
    default: ''
  pull:
    description: Refresh base images when building
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        target: ${{ inputs.target }}
        tags: ${{ inputs.tag }}
        pull: ${{ inputs.pull }}
        load: true
        push: false
        cache-from: type=gha,version=2,scope=${{ inputs.service }}
        cache-to: type=gha,version=2,scope=${{ inputs.service }},mode=max
