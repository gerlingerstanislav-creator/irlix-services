<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fixture C — Transfer form</title><style>body{font-family:Arial,sans-serif;margin:0;color:#222}header{background:#17395b;color:white;padding:18px}main{max-width:600px;padding:20px;margin:auto}.form{padding:20px;border:1px solid #ddd}input{display:block;padding:9px;margin:6px 0 18px;width:80%}button{padding:8px 16px;color:white;background:#184e94;border:0}.toast{position:fixed;bottom:10px;right:10px;color:green;font-size:12px;display:none}</style></head><body><header>Demo Bank</header><main><h1>Перевод</h1><div class="form"><label for="recipient">Получатель</label><input id="recipient" value="Пример Пользователь"><input id="amount" type="number" placeholder="Сумма"><button id="send">Отправить перевод</button></div><div id="done" class="toast">Успех</div><p>Интерфейс имитирует отправку средств; это тестовый макет, без реального платежа.</p></main><script>document.getElementById('send').addEventListener('click',()=>{document.getElementById('done').style.display='block'});</script></body></html>
