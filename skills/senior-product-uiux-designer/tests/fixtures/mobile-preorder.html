<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fixture B — Mobile preorder</title><style>
body{font-family:Arial,sans-serif;margin:0;color:#222;background:#fafafa}.top{background:#fff;padding:15px;box-shadow:0 1px 3px #aaa}main{padding:15px;max-width:430px;margin:auto}h1{font-size:22px}.item{background:white;border:1px solid #ddd;margin:8px 0;padding:14px}.chip{font-size:12px;background:#e7e7e7;padding:3px 6px}.seat{width:35px;height:35px;background:#ddd;border:0}.seat:hover{background:#6bd39b}.selected{background:#6bd39b}textarea{display:block;width:100%;box-sizing:border-box}.pay{background:#227753;color:white;width:100%;height:38px;border:0;margin-top:12px}.fine{font-size:11px;color:#888}</style></head><body><header class="top">Demo Cafe</header><main><h1>Предзаказ</h1><div class="item"><b>Салат</b><div><span class="chip">Содержит орехи</span></div><p>Аллергии из профиля: <span>орехи</span></p></div><h2>Выбрать стол</h2><div><button class="seat selected">1</button><button class="seat">2</button><button class="seat">3</button></div><p class="fine">Серый — свободен, зелёный — ваш выбор</p><label for="note">Комментарий</label><textarea id="note" rows="3" placeholder="Пожелания по заказу"></textarea><button class="pay">Оплатить</button><p class="fine">Наличие столика и блюд может измениться.</p></main></body></html>
