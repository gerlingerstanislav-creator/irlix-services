services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-irlix_services}
      POSTGRES_USER: ${POSTGRES_USER:-irlix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irlix_local}
      PLATFORM_CORE_DB_USER: ${PLATFORM_CORE_DB_USER:-platform_core_app}
      PLATFORM_CORE_DB_PASSWORD: ${PLATFORM_CORE_DB_PASSWORD:-platform_core_local}
      EMPLOYEES_DB_USER: ${EMPLOYEES_DB_USER:-employees_app}
      EMPLOYEES_DB_PASSWORD: ${EMPLOYEES_DB_PASSWORD:-employees_local}
      VACATIONS_DB_USER: ${VACATIONS_DB_USER:-vacations_app}
      VACATIONS_DB_PASSWORD: ${VACATIONS_DB_PASSWORD:-vacations_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irlix} -d ${POSTGRES_DB:-irlix_services}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-irlix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-irlix_local}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-relative-path=/keycloak/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-irlix_keycloak_local}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://192.168.90.100/keycloak/auth}
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-irlix}
      IRLIX_TEMP_ADMIN_PASSWORD: ${IRLIX_TEMP_ADMIN_PASSWORD:-}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-587}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-IRLIX}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-true}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-false}
      KC_HEALTH_ENABLED: "true"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/irlix-realm.json:/opt/keycloak/data/import/irlix-realm.json:ro
      - ./infra/keycloak:/opt/keycloak/irlix-infra:ro
      - ./infra/keycloak/themes/irlix:/opt/keycloak/themes/irlix:ro
    ports:
      - "127.0.0.1:8085:8080"

  platform-core:
    build:
      context: ./services/platform-core
    restart: unless-stopped
    environment:
      APP_NAME: IRLIX Platform Core
      APP_KEY: base64:5x91dbjB5+RZx5U5nV9QxscuW74E6k4nqv/8a6TTQfc=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-irlix_services}
      DB_USERNAME: ${PLATFORM_CORE_DB_USER:-platform_core_app}
      DB_PASSWORD: ${PLATFORM_CORE_DB_PASSWORD:-platform_core_local}
      DB_SEARCH_PATH: platform_core
      SESSION_DRIVER: array
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: sync
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8000"

  employees:
    build:
      context: ./services/employees
    restart: unless-stopped
    environment:
      APP_NAME: IRLIX Employees
      APP_KEY: base64:R0G8hoxpR8AX+7mE/L9hT7nFFrs2z7D5r17u0O/NDuQ=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-irlix_services}
      DB_USERNAME: ${EMPLOYEES_DB_USER:-employees_app}
      DB_PASSWORD: ${EMPLOYEES_DB_PASSWORD:-employees_local}
      DB_SEARCH_PATH: employees
      SESSION_DRIVER: array
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: sync
      KEYCLOAK_URL: http://keycloak:8080/keycloak/auth
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://192.168.90.100/keycloak/auth/realms/irlix}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-irlix}
      KEYCLOAK_CLIENT_ID: irlix-services-web
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-irlix_keycloak_local}
      IRLIX_PUBLIC_URL: ${IRLIX_PUBLIC_URL:-http://192.168.90.100}
      ONBOARDING_LINK_LIFESPAN: ${ONBOARDING_LINK_LIFESPAN:-86400}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-irlix}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-irlix_local}
      RABBITMQ_EVENTS_EXCHANGE: ${RABBITMQ_EVENTS_EXCHANGE:-irlix.events}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8000"

  employees-events:
    build:
      context: ./services/employees
    restart: unless-stopped
    command: ["php", "bin/publish-events.php"]
    environment:
      APP_NAME: IRLIX Employees Events
      APP_KEY: base64:R0G8hoxpR8AX+7mE/L9hT7nFFrs2z7D5r17u0O/NDuQ=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-irlix_services}
      DB_USERNAME: ${EMPLOYEES_DB_USER:-employees_app}
      DB_PASSWORD: ${EMPLOYEES_DB_PASSWORD:-employees_local}
      DB_SEARCH_PATH: employees
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-irlix}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-irlix_local}
      RABBITMQ_EVENTS_EXCHANGE: ${RABBITMQ_EVENTS_EXCHANGE:-irlix.events}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_IDLE_SLEEP: ${OUTBOX_IDLE_SLEEP:-2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  vacations:
    build:
      context: ./services/vacations
    restart: unless-stopped
    environment:
      APP_NAME: IRLIX Vacations
      APP_KEY: base64:IPCqxJs1PAHVYue4fWo1v4DimrddEbEIm3eaDFnOHtk=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-irlix_services}
      DB_USERNAME: ${VACATIONS_DB_USER:-vacations_app}
      DB_PASSWORD: ${VACATIONS_DB_PASSWORD:-vacations_local}
      DB_SEARCH_PATH: vacations
      SESSION_DRIVER: array
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: sync
      KEYCLOAK_URL: http://keycloak:8080/keycloak/auth
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://192.168.90.100/keycloak/auth/realms/irlix}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-irlix}
      KEYCLOAK_CLIENT_ID: irlix-services-web
      EMPLOYEES_URL: http://employees:8000/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      employees:
        condition: service_started
    ports:
      - "127.0.0.1:8086:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - platform-core
      - employees
    ports:
      - "127.0.0.1:8080:80"

  vacations-web:
    build:
      context: .
      dockerfile: apps/vacations/Dockerfile
    restart: unless-stopped
    depends_on:
      - vacations
    ports:
      - "127.0.0.1:8087:80"

  design-system:
    build:
      context: .
      dockerfile: apps/design-system/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  keycloak_data:
