server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name services.lan;

    location /api/platform/ { proxy_pass http://127.0.0.1:8081/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/employees/ { proxy_pass http://127.0.0.1:8082/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/vacations/ { proxy_pass http://127.0.0.1:8086/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/clients/ { proxy_pass http://127.0.0.1:8088/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/timesheets/ { proxy_pass http://127.0.0.1:8090/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/specialists/ { proxy_pass http://127.0.0.1:8092/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/recruitment/ { proxy_pass http://127.0.0.1:8094/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/cv-converter/ { proxy_pass http://127.0.0.1:8097/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300s; proxy_send_timeout 300s; client_max_body_size 20m; }
    location /api/migration/ { proxy_pass http://127.0.0.1:8098/api/migration/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 30s; }
    location /api/equipment/ { proxy_pass http://127.0.0.1:8100/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location /keycloak/auth/ { proxy_pass http://127.0.0.1:8085/keycloak/auth/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /keycloak/auth { return 301 /keycloak/auth/; }
    location = /auth { return 404; }
    location /auth/ { return 404; }

    location /employees/ { proxy_pass http://127.0.0.1:8080/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /employees { return 301 /employees/; }
    location /vacations/ { proxy_pass http://127.0.0.1:8087/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /vacations { return 301 /vacations/; }
    location /clients/ { proxy_pass http://127.0.0.1:8089/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /clients { return 301 /clients/; }
    location /timesheets/ { proxy_pass http://127.0.0.1:8091/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /timesheets { return 301 /timesheets/; }
    location /specialists/ { proxy_pass http://127.0.0.1:8093/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /specialists { return 301 /specialists/; }
    location /recruitment/ { proxy_pass http://127.0.0.1:8095/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /recruitment { return 301 /recruitment/; }
    location /cv-converter/ { proxy_pass http://127.0.0.1:8096/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /cv-converter { return 301 /cv-converter/; }
    location = /cv { return 301 /cv-converter/; }
    location /cv/ { return 301 /cv-converter/; }
    location /migration/ { proxy_pass http://127.0.0.1:8099/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /migration { return 301 /migration/; }
    location /equipment/ { proxy_pass http://127.0.0.1:8101/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /equipment { return 301 /equipment/; }
    location /design-system/ { proxy_pass http://127.0.0.1:8083/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /design-system { return 301 /design-system/; }
    location / { proxy_pass http://127.0.0.1:8084; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
