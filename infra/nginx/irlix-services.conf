server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name services.lan;

    location ~ ^/api/reports(?:/|$) { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/platform/ { proxy_pass http://127.0.0.1:8081/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/employees/ { proxy_pass http://127.0.0.1:8082/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/vacations/ { proxy_pass http://127.0.0.1:8086/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/clients/ { proxy_pass http://127.0.0.1:8088/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/timesheets/ { proxy_pass http://127.0.0.1:8090/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/specialists/ { proxy_pass http://127.0.0.1:8092/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/recruitment/ { proxy_pass http://127.0.0.1:8094/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/cv-converter/ { proxy_pass http://127.0.0.1:8097/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300s; proxy_send_timeout 300s; client_max_body_size 20m; }
    location /api/migration/ { proxy_pass http://127.0.0.1:8098/api/migration/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 30s; }
    location /api/finance/ { proxy_pass http://127.0.0.1:8104/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/equipment/ { proxy_pass http://127.0.0.1:8100/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location /keycloak/auth/ { proxy_pass http://127.0.0.1:8085/keycloak/auth/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /keycloak/auth { return 301 /keycloak/auth/; }
    location = /auth { return 404; }
    location /auth/ { return 404; }

    location /employees/ { proxy_pass http://127.0.0.1:8080/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /employees { return 301 /employees/; }
    location /vacations/ { proxy_pass http://127.0.0.1:8087/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /vacations { return 301 /vacations/; }
    location /clients/ { proxy_pass http://127.0.0.1:8089/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /clients { return 301 /clients/; }
    location /timesheets/ { proxy_pass http://127.0.0.1:8091/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /timesheets { return 301 /timesheets/; }
    location /specialists/ { proxy_pass http://127.0.0.1:8093/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /specialists { return 301 /specialists/; }
    location /recruitment/ { proxy_pass http://127.0.0.1:8095/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /recruitment { return 301 /recruitment/; }
    location /cv-converter/ { proxy_pass http://127.0.0.1:8096/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /cv-converter { return 301 /cv-converter/; }
    location = /cv { return 301 /cv-converter/; }
    location /cv/ { return 301 /cv-converter/; }
    location = /migration { return 302 /system/migration/; }
    location /migration/ { rewrite ^/migration/(.*)$ /system/migration/$1 redirect; }
    location = /system { return 301 /system/; }
    location /system/ { proxy_pass http://127.0.0.1:8102/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /resources { return 302 /system/resources/; }
    location = /resources/ { return 302 /system/resources/; }
    location = /service-map { return 302 /system/service-map/; }
    location = /service-map/ { return 302 /system/service-map/; }
    location /finance/ { proxy_pass http://127.0.0.1:8103/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /finance { return 301 /finance/; }
    location /equipment/ { proxy_pass http://127.0.0.1:8101/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /equipment { return 301 /equipment/; }
    # All paths including scripts/fonts/assets require a verified employee session.
    location = /_design_system_gate {
        internal;
        proxy_pass http://127.0.0.1:8082/_design_system_access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }
    # Explicit external redirect: error_page with a URI only rewrites internally
    # and can render the Portal SPA as 302 HTML under the protected URL.
    location @design_system_login {
        add_header Cache-Control "no-store" always;
        return 302 /?design-system=1&return=$uri;
    }
    location /design-system/ {
        auth_request /_design_system_gate;
        error_page 401 = @design_system_login;
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store" always;
    }
    location = /design-system { return 301 /design-system/; }

    # Brandbook files and all nested assets are protected at the origin, not by
    # hiding a navigation link or by client-side JavaScript.
    location = /_brandbook_gate {
        internal;
        proxy_pass http://127.0.0.1:8082/_brandbook_access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Explicit external redirect: error_page with a URI only rewrites internally
    # and can render the Portal SPA as 302 HTML under the protected URL.
    location @brandbook_login {
        add_header Cache-Control "no-store" always;
        return 302 /?brandbook=1;
    }
    location /brandbook/ {
        auth_request /_brandbook_gate;
        error_page 401 = @brandbook_login;
        proxy_pass http://127.0.0.1:8105/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store" always;
    }
    location = /brandbook { return 301 /brandbook/; }
    # Canonical same-origin route: every HTML/CSS/JS asset and file operation is
    # protected by the Employees platform-admin cookie gate.
    location = /_storage_pilot_gate {
        internal;
        # auth_request subrequests inherit the original upload Content-Length.
        # Below 11m this gate would return 413, surfaced as HTTP 500 by nginx.
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:8082/_storage_pilot_access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }
    location @storage_pilot_login {
        add_header Cache-Control "private, no-store" always;
        return 302 /?storage=1;
    }
    # V1 uses its own short-lived Employees identity gate; the legacy pilot
    # still requires platform-admin. Static Vue assets contain no file data.
    location = /_storage_v1_gate {
        internal;
        # auth_request subrequests inherit the original upload Content-Length.
        # Below 11m this gate would return 413, surfaced as HTTP 500 by nginx.
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:8082/_storage_v1_access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }
    location /api/storage/v1/ {
        auth_request /_storage_v1_gate;
        proxy_pass http://127.0.0.1:8114/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 11m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }
    location /api/storage/ {
        auth_request /_storage_pilot_gate;
        error_page 401 = @storage_pilot_login;
        proxy_pass http://127.0.0.1:8114/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 11m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }
    location /storage/ {
        # Static SPA only: Keycloak session and service grants are enforced in
        # the UI; all legacy and V1 data APIs remain independently gated.
        proxy_pass http://127.0.0.1:8115/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /storage { return 301 /storage/; }
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Irlix-Frontend "portal" always;
        expires -1;
    }
}

# Backwards-compatible redirect for old :8110 bookmarks. The entire Storage
# application is served only on the canonical port-80 /storage/ path above.
server {
    listen 8110 default_server;
    listen [::]:8110 default_server;
    server_name services.lan;
    add_header Cache-Control "no-store" always;
    location / { return 302 $scheme://$host/storage/; }
}
