services:
  migration:
    build: { context: ./services/migration }
    profiles: ["migration"]
    environment:
      APP_NAME: IRLIX Legacy Migration
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/migration.sqlite

      TARGET_SHARED_DB_HOST: ${TARGET_SHARED_DB_HOST:-postgres}
      TARGET_SHARED_DB_DATABASE: ${TARGET_SHARED_DB_DATABASE:-irlix_services}
      TARGET_EMPLOYEES_DB_PORT: ${TARGET_EMPLOYEES_DB_PORT:-5432}
      TARGET_EMPLOYEES_DB_USERNAME: ${TARGET_EMPLOYEES_DB_USERNAME:-employees_app}
      TARGET_EMPLOYEES_DB_PASSWORD: ${TARGET_EMPLOYEES_DB_PASSWORD:-employees_local}
      TARGET_VACATIONS_DB_PORT: ${TARGET_VACATIONS_DB_PORT:-5432}
      TARGET_VACATIONS_DB_USERNAME: ${TARGET_VACATIONS_DB_USERNAME:-vacations_app}
      TARGET_VACATIONS_DB_PASSWORD: ${TARGET_VACATIONS_DB_PASSWORD:-vacations_local}

      LEGACY_EMPLOYEES_DB_HOST: ${LEGACY_EMPLOYEES_DB_HOST:-}
      LEGACY_EMPLOYEES_DB_PORT: ${LEGACY_EMPLOYEES_DB_PORT:-5432}
      LEGACY_EMPLOYEES_DB_DATABASE: ${LEGACY_EMPLOYEES_DB_DATABASE:-}
      LEGACY_EMPLOYEES_DB_USERNAME: ${LEGACY_EMPLOYEES_DB_USERNAME:-}
      LEGACY_EMPLOYEES_DB_PASSWORD: ${LEGACY_EMPLOYEES_DB_PASSWORD:-}
      LEGACY_EMPLOYEES_DB_SSLMODE: ${LEGACY_EMPLOYEES_DB_SSLMODE:-prefer}
      LEGACY_EMPLOYEES_DB_READ_ONLY_CONFIRMED: ${LEGACY_EMPLOYEES_DB_READ_ONLY_CONFIRMED:-false}

      LEGACY_VACATIONS_DB_HOST: ${LEGACY_VACATIONS_DB_HOST:-}
      LEGACY_VACATIONS_DB_PORT: ${LEGACY_VACATIONS_DB_PORT:-5432}
      LEGACY_VACATIONS_DB_DATABASE: ${LEGACY_VACATIONS_DB_DATABASE:-}
      LEGACY_VACATIONS_DB_USERNAME: ${LEGACY_VACATIONS_DB_USERNAME:-}
      LEGACY_VACATIONS_DB_PASSWORD: ${LEGACY_VACATIONS_DB_PASSWORD:-}
      LEGACY_VACATIONS_DB_SSLMODE: ${LEGACY_VACATIONS_DB_SSLMODE:-prefer}
      LEGACY_VACATIONS_DB_READ_ONLY_CONFIRMED: ${LEGACY_VACATIONS_DB_READ_ONLY_CONFIRMED:-false}
      LEGACY_STATEMENT_TIMEOUT_MS: ${LEGACY_STATEMENT_TIMEOUT_MS:-15000}
    volumes:
      - migration_data:/data
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  migration_data:
