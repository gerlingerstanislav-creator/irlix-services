x-migration-environment: &migration-environment
  APP_NAME: IRLIX Legacy Migration
  APP_KEY: ${MIGRATION_APP_KEY:-}
  MIGRATION_APP_KEY: ${MIGRATION_APP_KEY:-}
  DB_CONNECTION: sqlite
  DB_DATABASE: /data/migration.sqlite
  MIGRATION_METADATA_DATABASE: /data/migration.sqlite
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: database
  EMPLOYEES_URL: http://employees:8000/api

  TARGET_SHARED_DB_HOST: postgres
  TARGET_SHARED_DB_DATABASE: ${POSTGRES_DB:-irlix_services}
  TARGET_EMPLOYEES_DB_PORT: 5432
  TARGET_EMPLOYEES_DB_USERNAME: ${EMPLOYEES_DB_USER:-employees_app}
  TARGET_EMPLOYEES_DB_PASSWORD: ${EMPLOYEES_DB_PASSWORD:-employees_local}
  TARGET_VACATIONS_DB_PORT: 5432
  TARGET_VACATIONS_DB_USERNAME: ${VACATIONS_DB_USER:-vacations_app}
  TARGET_VACATIONS_DB_PASSWORD: ${VACATIONS_DB_PASSWORD:-vacations_local}

  # Optional CLI fallback only. The web admin console stores actual legacy credentials encrypted
  # in migration-service's private SQLite volume and never returns passwords to the browser.
  LEGACY_EMPLOYEES_DB_HOST: ${LEGACY_EMPLOYEES_DB_HOST:-}
  LEGACY_EMPLOYEES_DB_PORT: ${LEGACY_EMPLOYEES_DB_PORT:-5432}
  LEGACY_EMPLOYEES_DB_DATABASE: ${LEGACY_EMPLOYEES_DB_DATABASE:-}
  LEGACY_EMPLOYEES_DB_USERNAME: ${LEGACY_EMPLOYEES_DB_USERNAME:-}
  LEGACY_EMPLOYEES_DB_PASSWORD: ${LEGACY_EMPLOYEES_DB_PASSWORD:-}
  LEGACY_EMPLOYEES_DB_SSLMODE: ${LEGACY_EMPLOYEES_DB_SSLMODE:-disable}
  LEGACY_EMPLOYEES_DB_READ_ONLY_CONFIRMED: ${LEGACY_EMPLOYEES_DB_READ_ONLY_CONFIRMED:-false}

  LEGACY_VACATIONS_DB_HOST: ${LEGACY_VACATIONS_DB_HOST:-}
  LEGACY_VACATIONS_DB_PORT: ${LEGACY_VACATIONS_DB_PORT:-5432}
  LEGACY_VACATIONS_DB_DATABASE: ${LEGACY_VACATIONS_DB_DATABASE:-}
  LEGACY_VACATIONS_DB_USERNAME: ${LEGACY_VACATIONS_DB_USERNAME:-}
  LEGACY_VACATIONS_DB_PASSWORD: ${LEGACY_VACATIONS_DB_PASSWORD:-}
  LEGACY_VACATIONS_DB_SSLMODE: ${LEGACY_VACATIONS_DB_SSLMODE:-disable}
  LEGACY_VACATIONS_DB_READ_ONLY_CONFIRMED: ${LEGACY_VACATIONS_DB_READ_ONLY_CONFIRMED:-false}
  LEGACY_STATEMENT_TIMEOUT_MS: ${LEGACY_STATEMENT_TIMEOUT_MS:-15000}

services:
  migration:
    build: { context: ./services/migration }
    restart: unless-stopped
    environment:
      <<: *migration-environment
    volumes:
      - migration_data:/data
    depends_on:
      postgres: { condition: service_healthy }
      employees: { condition: service_started }
    ports: ["127.0.0.1:8098:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8000/api/migration/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migration-worker:
    build: { context: ./services/migration }
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--queue=migration", "--sleep=1", "--tries=1", "--timeout=0"]
    environment:
      <<: *migration-environment
      MIGRATION_SKIP_BOOTSTRAP: "true"
    volumes:
      - migration_data:/data
    depends_on:
      migration: { condition: service_healthy }

volumes:
  migration_data:
