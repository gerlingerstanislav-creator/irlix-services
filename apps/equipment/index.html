<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>IRLIX · Учёт техники</title><script>try{const pref=localStorage.getItem('irlix:theme');const mode=['light','dark','system'].includes(pref)?pref:'system';const theme=mode==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode;document.documentElement.dataset.theme=theme;document.documentElement.dataset.themePreference=mode;document.documentElement.style.colorScheme=theme}catch(_){document.documentElement.dataset.theme='light'}</script></head><body><div id="app"></div><script type="module" src="/src/main.js"></script></body></html>
