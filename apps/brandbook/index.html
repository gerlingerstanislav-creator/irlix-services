<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRLIX — цифровая основа брендбука v1.0</title>
  <!-- Digital basis published behind SSO; full corporate content approval and search indexing remain pending. Keep noindex. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <script>
    try {
      const preference = localStorage.getItem('irlix:theme') || 'system';
      const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch (_) {}
  </script>
</head>
<body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
