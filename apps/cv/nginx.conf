server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Vite assets are content-addressed and may be cached forever, but a missing
  # asset must never fall through to the SPA HTML (browsers reject HTML served
  # as a stylesheet/script and render an unstyled/broken application).
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # The application shell points to hashed assets and must always be
  # revalidated so a new container cannot leave clients with stale asset URLs.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
