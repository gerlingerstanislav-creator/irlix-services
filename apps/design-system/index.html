<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/design-system/favicon.svg" />
    <title>IRLIX Design System</title>
    <script>
    // Before-paint bootstrap; the shared @irlix/ui theme manager owns subsequent updates.
    try {
      const preference = localStorage.getItem('irlix:theme');
      const mode = ['light','dark','system'].includes(preference) ? preference : 'system';
      const resolved = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = mode;
      document.documentElement.style.colorScheme = resolved;
    } catch (_) { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  </script>
</head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
