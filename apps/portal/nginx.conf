server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /auth/logout {
        return 302 /auth/logout/;
    }

    location = /auth/logout/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /auth/ {
        return 404;
    }

    # Fallback routing for service paths that reach Portal through a legacy host nginx config.
    location = /vacations {
        return 302 /vacations/;
    }

    location /vacations/ {
        proxy_pass http://vacations-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/vacations/ {
        proxy_pass http://vacations:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
