server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /auth/logout {
        return 302 /auth/logout/;
    }

    location = /auth/logout/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /auth/ {
        return 404;
    }

    # Fallback routing for service paths that reach Portal through a legacy host nginx config.
    location = /vacations {
        return 302 /vacations/;
    }

    location /vacations/ {
        proxy_pass http://vacations-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/vacations/ {
        proxy_pass http://vacations:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Security fallback for hosts still routing /design-system/* through Portal.
    location = /_design_system_fallback_gate {
        internal;
        proxy_pass http://employees:8000/_design_system_access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }
    location = /design-system { return 301 /design-system/; }
    location /design-system/ {
        auth_request /_design_system_fallback_gate;
        error_page 401 =302 /?design-system=1&return=$uri;
        rewrite ^/design-system/(.*)$ /$1 break;
        proxy_pass http://design-system;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    # Fallback for hosts still routing /brandbook/* through Portal.
    # Keep the same server-side SSO gate as the canonical host nginx route.
    location = /_brandbook_fallback_gate {
        internal;
        proxy_pass http://employees:8000/_brandbook_access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    location = /brandbook { return 301 /brandbook/; }

    location /brandbook/ {
        auth_request /_brandbook_fallback_gate;
        error_page 401 =302 /?brandbook=1;
        rewrite ^/brandbook/(.*)$ /$1 break;
        proxy_pass http://brandbook;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location = /recruitment {
        return 302 /recruitment/;
    }

    location /recruitment/ {
        proxy_pass http://recruitment-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/recruitment/ {
        proxy_pass http://recruitment:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
