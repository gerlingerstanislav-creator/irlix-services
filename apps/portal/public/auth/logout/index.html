<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRLIX — выход</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#475467;background:#f5f7f8}body{margin:0;min-height:100vh;display:grid;place-items:center}.card{padding:24px 28px;border:1px solid #e2e7ea;border-radius:12px;background:#fff;box-shadow:0 8px 28px rgba(20,37,63,.05);font-size:13px}
  </style>
</head>
<body>
  <div class="card" id="status">Сбрасываем авторизацию…</div>
  <script>
    (async () => {
      const status = document.getElementById('status');
      let idToken = null;

      for (let index = sessionStorage.length - 1; index >= 0; index -= 1) {
        const key = sessionStorage.key(index);
        if (!key || !key.startsWith('irlix.') || !key.includes('.auth.')) continue;
        if (!idToken && key.endsWith('.tokens')) {
          try { idToken = JSON.parse(sessionStorage.getItem(key) || 'null')?.id_token || null; }
          catch (_) { idToken = null; }
        }
        sessionStorage.removeItem(key);
      }

      try {
        const discoveryResponse = await fetch('/keycloak/auth/realms/irlix/.well-known/openid-configuration', {
          headers: { Accept: 'application/json' },
          cache: 'no-store',
        });
        if (!discoveryResponse.ok) throw new Error(`discovery ${discoveryResponse.status}`);
        const discovery = await discoveryResponse.json();
        if (!discovery.end_session_endpoint) throw new Error('logout endpoint unavailable');

        const params = new URLSearchParams({
          client_id: 'irlix-services-web',
          post_logout_redirect_uri: `${window.location.origin}/`,
        });
        if (idToken) params.set('id_token_hint', idToken);
        window.location.replace(`${discovery.end_session_endpoint}?${params.toString()}`);
      } catch (error) {
        console.error('Platform logout failed', error);
        status.textContent = 'Локальная авторизация сброшена. Возвращаемся на Dashboard…';
        window.setTimeout(() => window.location.replace('/'), 800);
      }
    })();
  </script>
</body>
</html>
