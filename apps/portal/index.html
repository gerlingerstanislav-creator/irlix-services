<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>IRLIX Dashboard</title>
  <style>
    [hidden]{display:none!important}body{margin:0;background:var(--irlix-color-bg,#f5f7f8)}
    .portal-shell{min-height:100vh;display:grid;grid-template-columns:var(--irlix-sidebar-width,60px) minmax(0,1fr)}
    #portal-sidebar{grid-column:1;grid-row:1;position:relative;z-index:40}
    .portal-workspace{grid-column:2;grid-row:1;min-width:0}
    .auth-loading{min-height:100vh;display:grid;place-items:center;font:14px Inter,system-ui,sans-serif;padding:24px}
    @media(max-width:720px){.portal-shell{grid-template-columns:minmax(0,1fr)}.portal-workspace{grid-column:1;grid-row:2}}
  </style>
</head>
<body>
  <div id="auth-loading" class="auth-loading">
    <strong id="auth-loading-title">Проверяем авторизацию…</strong>
    <span id="auth-loading-stage" style="color:#667085;font-size:13px">Этап: загрузка frontend</span>
    <small id="auth-loading-build" style="color:#98a2b3;font-size:11px">Диагностика: portal-startup-v2</small>
    <noscript><strong>JavaScript отключён или заблокирован. Без JavaScript авторизация платформы не работает.</strong></noscript>
  </div>
  <div id="portal-shell" class="portal-shell" hidden>
    <div id="portal-sidebar"></div>
    <div class="portal-workspace"><div id="portal-topbar"></div><main id="dashboard-services"></main></div>
  </div>
  <script>
    (() => {
      const BUILD = 'portal-startup-v2';
      const loading = document.getElementById('auth-loading');
      const title = document.getElementById('auth-loading-title');
      const stageNode = document.getElementById('auth-loading-stage');
      const buildNode = document.getElementById('auth-loading-build');
      let stage = 'html-loaded';
      let finished = false;
      let watchdog = null;
      const labels = {
        'html-loaded': 'HTML загружен, ожидаем запуск JavaScript-модуля',
        'module-loaded': 'frontend-модуль загружен',
        startup: 'запуск приложения',
        'auth-init': 'инициализация авторизации',
        'oidc-discovery': 'получение OIDC-конфигурации',
        'oidc-discovery-complete': 'OIDC-конфигурация получена',
        'callback-check': 'проверка callback авторизации',
        'token-exchange': 'обмен кода на токен',
        'token-exchange-complete': 'токен получен',
        'initial-token-read': 'проверка наличия локальной сессии',
        'no-local-session': 'локальной сессии нет, переходим в Keycloak',
        'initial-session-token-read': 'чтение токена начальной сессии',
        'initial-session-token-parse': 'разбор токена начальной сессии',
        'initial-session-issuer-check': 'проверка issuer начальной сессии',
        'initial-session-expiry-check': 'проверка срока токена начальной сессии',
        'initial-session-refresh': 'обновление начальной сессии',
        'initial-session-token-ready': 'начальная сессия готова',
        'invalid-local-session': 'локальная сессия некорректна, выполняем восстановление',
        'startup-recovery': 'автоматическое восстановление авторизации',
        'api-session-token-read': 'проверка токена перед API',
        'api-session-token-parse': 'разбор токена перед API',
        'api-session-issuer-check': 'проверка issuer перед API',
        'api-session-expiry-check': 'проверка срока токена перед API',
        'api-session-refresh': 'обновление токена перед API',
        'api-session-token-ready': 'токен для API готов',
        'api-request': 'запрос к API',
        'api-response': 'ответ API получен',
        'authorization-redirect': 'переход в Keycloak',
        authenticated: 'авторизация подтверждена',
        'access-check': 'проверка доступа сотрудника',
        'access-check-complete': 'доступ сотрудника подтверждён',
      };
      const render = (detail = '') => {
        if (stageNode) stageNode.textContent = `Этап: ${labels[stage] || stage}${detail ? ` · ${detail}` : ''}`;
        if (buildNode) buildNode.textContent = `Диагностика: ${BUILD} · ${location.origin}`;
      };
      const arm = () => {
        clearTimeout(watchdog);
        watchdog = setTimeout(() => {
          if (finished) return;
          if (title) title.textContent = 'Авторизация не завершилась за 15 секунд';
          if (stageNode) stageNode.textContent = `Остановлено на этапе: ${labels[stage] || stage}`;
          if (buildNode) buildNode.textContent = `Диагностика: ${BUILD} · ${location.origin} · ${navigator.userAgent}`;
        }, 15000);
      };
      window.__irlixStartup = {
        build: BUILD,
        get stageName() { return stage; },
        stage(name, detail = '') { stage = name || stage; render(detail); arm(); },
        moduleStarted(name) { stage = 'module-loaded'; render(name || ''); arm(); },
        done() { finished = true; clearTimeout(watchdog); },
        fail(error) {
          finished = true; clearTimeout(watchdog);
          if (loading) loading.hidden = false;
          if (title) title.textContent = 'Не удалось завершить авторизацию';
          if (stageNode) stageNode.textContent = `Этап: ${labels[stage] || stage}`;
          if (buildNode) buildNode.textContent = `Ошибка: ${String(error || 'unknown')}`;
        },
      };
      window.addEventListener('error', (event) => {
        if (finished) return;
        window.__irlixStartup.fail(event?.message || 'Ошибка загрузки JavaScript');
      }, true);
      window.addEventListener('unhandledrejection', (event) => {
        if (finished) return;
        window.__irlixStartup.fail(event?.reason?.message || event?.reason || 'Unhandled promise rejection');
      });
      render();
      arm();
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
